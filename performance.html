<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0f19;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        #network-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .overlay-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            text-align: center;
            color: #ffffff;
            pointer-events: none; /* Allows clicking the canvas underneath */
        }

        h1 {
            font-size: 3rem;
            font-weight: 300;
            letter-spacing: 4px;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255,255,255,0.2);
        }

        p {
            color: #64748b;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <canvas id="network-canvas"></canvas>

    <div class="overlay-content">
        <h1>WELCOME</h1>
        <p>Choose a node</p>
    </div>

    <script>
        const canvas = document.getElementById('network-canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initNodes();
        });

        // Configuration for your main navigation pages
        const navigationNodes = [
            { label: "ABOUT", url: "/about.html", baseAngle: 0, distance: 200 },
            { label: "CONTACT", url: "/contact.html", baseAngle: 2, distance: 220 },
            { label: "EVENTS", url: "/events.html", baseAngle: 4, distance: 210 },
            { label: "PROJECTS", url: "/projects.html", baseAngle: 5.2, distance: 190 }
        ];

        let nodes = [];
        let backgroundParticles = [];

        class InteractiveNode {
            constructor(config) {
                this.label = config.label;
                this.url = config.url;
                this.baseAngle = config.baseAngle;
                this.distance = config.distance;
                
                // Position properties
                this.x = 0;
                this.y = 0;
                this.radius = 12;
                this.pulse = 0;
                this.isHovered = false;
                
                // Unique offset so they don't sync up perfectly while breathing
                this.breathingOffset = Math.random() * 100;
            }

            update(time) {
                // The "Breathing" logic: subtly alters the distance from the center over time
                const breath = Math.sin(time * 0.002 + this.breathingOffset) * 15;
                const currentDistance = this.distance + breath;

                // Center of the screen anchor
                const centerX = width / 2;
                const centerY = height / 2;

                // Orbit slightly over time to give it life
                const currentAngle = this.baseAngle + Math.sin(time * 0.0005) * 0.1;

                this.x = centerX + Math.cos(currentAngle) * currentDistance;
                this.y = centerY + Math.sin(currentAngle) * currentDistance;

                // Pulsing glow animation
                this.pulse = Math.sin(time * 0.005 + this.breathingOffset) * 6 + 6;
            }

            draw() {
                // Draw expanding pulse glow ring
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius + this.pulse, 0, Math.PI * 2);
                ctx.fillStyle = this.isHovered ? 'rgba(99, 102, 241, 0.2)' : 'rgba(14, 165, 233, 0.15)';
                ctx.fill();

                // Draw core node
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.isHovered ? 8 : 6, 0, Math.PI * 2);
                ctx.fillStyle = this.isHovered ? '#6366f1' : '#0ea5e9';
                ctx.fill();

                // Text labels
                ctx.fillStyle = this.isHovered ? '#ffffff' : '#94a3b8';
                ctx.font = '14px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(this.label, this.x, this.y - (this.radius + 12));
            }

            checkMouse(mx, my) {
                const dist = Math.hypot(this.x - mx, this.y - my);
                this.isHovered = dist < this.radius + 10;
                return this.isHovered;
            }
        }

        // Tiny floating dots to flesh out the "web" structure
        class BackgroundParticle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;
            }
        }

        function initNodes() {
            nodes = navigationNodes.map(config => new InteractiveNode(config));
            backgroundParticles = [];
            for(let i = 0; i < 40; i++) {
                backgroundParticles.push(new BackgroundParticle());
            }
        }

        function drawConnections() {
            ctx.strokeStyle = 'rgba(51, 65, 85, 0.3)';
            ctx.lineWidth = 1;

            // Connect interactive nodes to each other
            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    ctx.beginPath();
                    ctx.moveTo(nodes[i].x, nodes[i].y);
                    ctx.lineTo(nodes[j].x, nodes[j].y);
                    ctx.stroke();
                }
            }

            // Draw faint web links to background floating particles
            backgroundParticles.forEach(p => {
                nodes.forEach(n => {
                    const dist = Math.hypot(n.x - p.x, n.y - p.y);
                    if (dist < 180) {
                        ctx.strokeStyle = `rgba(51, 65, 85, ${0.15 * (1 - dist/180)})`;
                        ctx.beginPath();
                        ctx.moveTo(n.x, n.y);
                        ctx.lineTo(p.x, p.y);
                        ctx.stroke();
                    }
                });
            });
        }

        function animate(timestamp) {
            ctx.clearRect(0, 0, width, height);

            backgroundParticles.forEach(p => p.update());
            nodes.forEach(n => n.update(timestamp));

            drawConnections();
            
            // Draw background tiny dots
            ctx.fillStyle = 'rgba(148, 163, 184, 0.4)';
            backgroundParticles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 1.5, 0, Math.PI * 2);
                ctx.fill();
            });

            nodes.forEach(n => n.draw());

            requestAnimationFrame(animate);
        }

        // Mouse Event Handlers
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;
            
            let cursorStyle = 'default';
            nodes.forEach(n => {
                if (n.checkMouse(mx, my)) cursorStyle = 'pointer';
            });
            document.body.style.cursor = cursorStyle;
        });

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;
            
            nodes.forEach(n => {
                if (n.checkMouse(mx, my)) {
                    // Triggers the page transition when clicked
                    window.location.href = n.url; 
                }
            });
        });

        initNodes();
        requestAnimationFrame(animate);
    </script>
</body>
</html>
