/* ============================================================
   INTERACTIVE NODE
============================================================ */

class InteractiveNode {


    constructor(
        config,
        index = 0
    ) {

        this.id =
            config.id;

        this.label =
            config.label;

        this.url =
            config.url;

        this.color =
            config.color;

        this.glow =
            config.glow;

        this.radius =
            config.size || 8;

        this.isBold =
            config.bold || false;

        this.primary =
            config.primary || false;

        this.home =
            config.home || false;

        this.fixedX =
            config.fixedX;

        this.fixedY =
            config.fixedY;

        this.index =
            index;


        this.baseAngle =
            config.angle !== undefined
                ? config.angle
                : Math.random() *
                  Math.PI * 2;


        this.distance =
            config.distance ||
            110 +
            Math.random() *
            210;


        this.phase =
            Math.random() *
            Math.PI * 2;


        this.x = 0;

        this.y = 0;

        this.hoverScale = 0;
    }



    update(time) {

        const cx =
            width / 2;

        const cy =
            height / 2;


        /*
        PRIMARY NODES
        */

        if (
            this.primary
        ) {

            this.x =
                width *
                this.fixedX;

            this.y =
                height *
                this.fixedY;


            /*
            Tiny breathing movement.

            HOME stays completely fixed.
            */

            if (
                !this.home
            ) {

                this.x +=
                    Math.sin(
                        time * 0.0004 +
                        this.phase
                    ) * 2;

                this.y +=
                    Math.cos(
                        time * 0.00035 +
                        this.phase
                    ) * 2;
            }

        }


        /*
        SMALLER / OUTER NODES
        */

        else {

            const orbit =
                this.baseAngle +

                Math.sin(
                    time * 0.00012 +
                    this.phase
                ) * 0.10;


            const distance =
                this.distance +

                Math.sin(
                    time * 0.00015 +
                    this.phase
                ) * 12;


            this.x =
                cx +
                Math.cos(orbit) *
                distance;


            this.y =
                cy +
                Math.sin(orbit) *
                distance *
                0.72;
        }


        /*
        HOVER
        */

        const dx =
            mouse.x -
            this.x;

        const dy =
            mouse.y -
            this.y;


        const distance =
            Math.hypot(
                dx,
                dy
            );


        const target =
            distance <
            this.radius + 35
                ? 1
                : 0;


        this.hoverScale +=
            (
                target -
                this.hoverScale
            ) * 0.12;
    }



    draw(time) {

        /*
        Pulsing glow
        */

        const pulse =
            Math.sin(
                time * 0.002 +
                this.phase
            ) *
            0.5 +
            0.5;


        const pulseAmount =
            pulse * 4;


        /*
        ========================================================
        OUTER GLOW
        ========================================================
        */

        ctx.beginPath();

        ctx.arc(

            this.x,

            this.y,

            this.radius +
            10 +
            pulseAmount +
            this.hoverScale * 8,

            0,

            Math.PI * 2
        );


        ctx.fillStyle =
            this.glow;


        ctx.globalAlpha =
            0.65 +
            pulse * 0.15;


        ctx.fill();


        /*
        SECONDARY SOFT GLOW
        */

        ctx.beginPath();

        ctx.arc(

            this.x,

            this.y,

            this.radius +
            5 +
            this.hoverScale * 5,

            0,

            Math.PI * 2
        );


        ctx.fillStyle =
            this.glow;


        ctx.globalAlpha =
            0.45;


        ctx.fill();


        /*
        ========================================================
        CORE
        ========================================================
        */

        ctx.globalAlpha = 1;


        ctx.beginPath();

        ctx.arc(

            this.x,

            this.y,

            this.radius +
            this.hoverScale * 3,

            0,

            Math.PI * 2
        );


        ctx.fillStyle =
            this.color;


        ctx.fill();


        /*
        ========================================================
        BRIGHT CENTER
        ========================================================
        */

        ctx.beginPath();

        ctx.arc(

            this.x,

            this.y,

            Math.max(
                1.6,
                this.radius * 0.34
            ),

            0,

            Math.PI * 2
        );


        ctx.fillStyle =
            "rgba(255,255,255,0.82)";


        ctx.globalAlpha =
            0.55 +
            pulse * 0.30;


        ctx.fill();


        /*
        ========================================================
        LABEL
        ========================================================
        */

        ctx.globalAlpha = 1;


        const labelAngle =
            Math.atan2(

                this.y -
                height / 2,

                this.x -
                width / 2
            );


        const labelDistance =
            this.radius +
            20 +
            this.hoverScale * 7;


        const lx =
            this.x +
            Math.cos(labelAngle) *
            labelDistance;


        const ly =
            this.y +
            Math.sin(labelAngle) *
            labelDistance;


        ctx.fillStyle =
            this.color ===
            palette.white
                ? "#f8fafc"
                : this.color;


        ctx.font =
            this.isBold

                ? "600 14px 'Trebuchet MS', 'Segoe UI', sans-serif"

                : "500 11px 'Trebuchet MS', 'Segoe UI', sans-serif";


        ctx.textAlign =
            "center";


        ctx.textBaseline =
            "middle";


        /*
        Text glow
        */

        ctx.shadowBlur = 10;

        ctx.shadowColor =
            this.color;


        ctx.fillText(

            this.label,

            lx,

            ly
        );


        ctx.shadowBlur = 0;
    }



    containsPoint(
        x,
        y
    ) {

        return (

            Math.hypot(

                x -
                this.x,

                y -
                this.y

            )

            <

            this.radius +
            18
        );
    }

}



/* ============================================================
   TENDRIL
============================================================ */

class Tendril {


    constructor(
        a,
        b,
        options = {}
    ) {

        this.a = a;

        this.b = b;


        this.phase =
            Math.random() *
            Math.PI * 2;


        this.wave =
            options.wave ||
            35 +
            Math.random() *
            45;


        this.speed =
            0.0003 +
            Math.random() *
            0.0003;


        this.alpha =
            options.alpha ||
            0.12;
    }



    draw(time) {

        const ax =
            this.a.x;

        const ay =
            this.a.y;

        const bx =
            this.b.x;

        const by =
            this.b.y;


        const dx =
            bx -
            ax;

        const dy =
            by -
            ay;


        const distance =
            Math.hypot(
                dx,
                dy
            );


        if (
            !distance
        ) {

            return;
        }


        /*
        Perpendicular direction
        */

        const nx =
            -dy /
            distance;

        const ny =
            dx /
            distance;


        /*
        Moving wave
        */

        const wave =
            Math.sin(

                time *
                this.speed +

                this.phase

            ) *

            this.wave;


        /*
        First control point
        */

        const c1x =
            ax +
            dx * 0.18 +
            nx * wave;


        const c1y =
            ay +
            dy * 0.18 +
            ny * wave;


        /*
        Second control point
        */

        const c2x =
            ax +
            dx * 0.72 -
            nx * wave * 1.25;


        const c2y =
            ay +
            dy * 0.72 -
            ny * wave * 1.25;


        /*
        ========================================================
        SOFT OUTER TENDRIL
        ========================================================
        */

        ctx.beginPath();

        ctx.moveTo(
            ax,
            ay
        );


        ctx.bezierCurveTo(

            c1x,
            c1y,

            c2x,
            c2y,

            bx,
            by
        );


        ctx.strokeStyle =
            "rgba(130,100,255,0.035)";


        ctx.lineWidth = 3;


        ctx.globalAlpha = 1;


        ctx.stroke();


        /*
        ========================================================
        MAIN TENDRIL
        ========================================================
        */

        ctx.beginPath();

        ctx.moveTo(
            ax,
            ay
        );


        ctx.bezierCurveTo(

            c1x,
            c1y,

            c2x,
            c2y,

            bx,
            by
        );


        ctx.strokeStyle =
            `rgba(
                190,
                175,
                255,
                ${this.alpha}
            )`;


        ctx.lineWidth =
            0.65;


        ctx.stroke();
    }

}



/* ============================================================
   CREATE NODES
============================================================ */

const nodes = [];


navigationNodes.forEach(

    (
        config,
        index
    ) => {

        nodes.push(

            new InteractiveNode(

                config,

                index
            )
        );
    }
);


outerNodes.forEach(

    (
        config,
        index
    ) => {

        nodes.push(

            new InteractiveNode(

                config,

                navigationNodes.length +
                index
            )
        );
    }
);



/* ============================================================
   CREATE TENDRILS
============================================================ */

const tendrils = [];


/*
PRIMARY NODES

HOME deliberately excluded.
*/

const primaryNodes =
    nodes.filter(

        node =>

            node.primary &&
            !node.home
    );



/*
Connect every primary
node to every other primary.

This keeps the main web
dense and intentional.
*/

for (

    let i = 0;

    i <
    primaryNodes.length;

    i++

) {

    for (

        let j = i + 1;

        j <
        primaryNodes.length;

        j++

    ) {

        tendrils.push(

            new Tendril(

                primaryNodes[i],

                primaryNodes[j],

                {

                    wave:
                        45 +
                        Math.random() *
                        35,

                    alpha:
                        0.105
                }
            )
        );
    }
}



/*
SMALLER WEB NODES
*/

const webNodes =
    nodes.filter(

        node =>
            !node.home
    );


for (

    let i = 0;

    i <
    webNodes.length;

    i++

) {

    for (

        let j = i + 1;

        j <
        webNodes.length;

        j++

    ) {

        const a =
            webNodes[i];

        const b =
            webNodes[j];


        /*
        Don't duplicate
        primary connections.
        */

        if (

            a.primary &&
            b.primary

        ) {

            continue;
        }


        /*
        Sparse extra network.
        */

        if (

            Math.random() <
            0.34

        ) {

            tendrils.push(

                new Tendril(

                    a,

                    b,

                    {

                        wave:
                            28 +
                            Math.random() *
                            42,

                        alpha:
                            0.075 +
                            Math.random() *
                            0.045
                    }
                )
            );
        }
    }
}



/*
OUTER NODES

Each gets two connections.
*/

outerNodes.forEach(

    config => {

        const outer =
            nodes.find(

                node =>
                    node.id ===
                    config.id
            );


        const possible =
            primaryNodes.slice();


        possible.sort(

            () =>
                Math.random() -
                0.5
        );


        possible
            .slice(0, 2)
            .forEach(

                target => {

                    tendrils.push(

                        new Tendril(

                            outer,

                            target,

                            {

                                wave:
                                    55 +
                                    Math.random() *
                                    35,

                                alpha:
                                    0.09
                            }
                        )
                    );
                }
            );
    }
);



/* ============================================================
   MOVING GLITTER
============================================================ */

class GlitterParticle {


    constructor() {

        this.x =
            Math.random() *
            width;


        this.y =
            Math.random() *
            height;


        this.vx =
            (
                Math.random() -
                0.5
            ) *
            0.22;


        this.vy =
            (
                Math.random() -
                0.5
            ) *
            0.22;


        this.size =
            Math.random() *
            1.8 +
            0.4;


        this.phase =
            Math.random() *
            Math.PI * 2;


        this.color =

            [

                palette.white,

                palette.blue,

                palette.purple,

                palette.orange

            ][

                Math.floor(
                    Math.random() * 4
                )
            ];
    }



    update() {

        this.x +=
            this.vx;

        this.y +=
            this.vy;


        /*
        Bounce softly
        */

        if (

            this.x < 0 ||
            this.x > width

        ) {

            this.vx *= -1;
        }


        if (

            this.y < 0 ||
            this.y > height

        ) {

            this.vy *= -1;
        }
    }



    draw() {

        const pulse =

            (

                Math.sin(

                    performance.now() *
                    0.0015 +

                    this.phase

                )

                + 1

            ) * 0.5;


        /*
        ========================================================
        SOFT GLITTER GLOW
        ========================================================
        */

        ctx.beginPath();


        ctx.arc(

            this.x,

            this.y,

            this.size * 4,

            0,

            Math.PI * 2
        );


        ctx.fillStyle =
            this.color;


        ctx.globalAlpha =

            0.025 +
            pulse * 0.07;


        ctx.fill();


        /*
        ========================================================
        GLITTER CORE
        ========================================================
        */

        ctx.beginPath();


        ctx.arc(

            this.x,

            this.y,

            this.size +
            pulse * 0.7,

            0,

            Math.PI * 2
        );


        ctx.fillStyle =
            this.color;


        ctx.globalAlpha =

            0.18 +
            pulse * 0.50;


        ctx.fill();


        ctx.globalAlpha = 1;
    }

}



/*
180 moving particles
*/

const glitter = [];


for (

    let i = 0;

    i < 180;

    i++

) {

    glitter.push(

        new GlitterParticle()
    );
}



/* ============================================================
   LARGE SPARKLES
============================================================ */

class Sparkle {


    constructor() {

        this.x =
            Math.random() *
            width;


        this.y =
            Math.random() *
            height;


        this.size =
            1.8 +
            Math.random() *
            4.5;


        this.phase =
            Math.random() *
            Math.PI * 2;


        this.speed =
            0.001 +
            Math.random() *
            0.0025;


        this.vx =
            (
                Math.random() -
                0.5
            ) *
            0.06;


        this.vy =
            (
                Math.random() -
                0.5
            ) *
            0.06;


        this.color =

            [

                palette.white,

                palette.blue,

                palette.purple,

                palette.orange

            ][

                Math.floor(
                    Math.random() * 4
                )
            ];
    }



    update(time) {

        this.x +=
            this.vx;

        this.y +=
            this.vy;


        /*
        Gentle floating movement
        */

        this.x +=

            Math.sin(

                time * 0.00012 +
                this.phase

            ) * 0.035;


        this.y +=

            Math.cos(

                time * 0.00010 +
                this.phase

            ) * 0.035;


        /*
        Wrap around
        */

        if (
            this.x < -20
        ) {

            this.x =
                width + 20;
        }


        if (
            this.x >
            width + 20
        ) {

            this.x = -20;
        }


        if (
            this.y < -20
        ) {

            this.y =
                height + 20;
        }


        if (
            this.y >
            height + 20
        ) {

            this.y = -20;
        }
    }



    draw(time) {

        const pulse =

            (

                Math.sin(

                    time *
                    this.speed +

                    this.phase

                )

                + 1

            ) * 0.5;


        const size =

            this.size *

            (

                0.35 +
                pulse * 0.95

            );


        const alpha =

            0.08 +
            pulse * 0.58;


        /*
        ========================================================
        SOFT LARGE GLOW
        ========================================================
        */

        const glow =
            ctx.createRadialGradient(

                this.x,
                this.y,
                0,

                this.x,
                this.y,
                size * 4
            );


        glow.addColorStop(

            0,

            "rgba(255,255,255,0.55)"
        );


        glow.addColorStop(

            0.18,

            this.color
        );


        glow.addColorStop(

            1,

            "rgba(0,0,0,0)"
        );


        ctx.globalAlpha =
            alpha * 0.35;


        ctx.fillStyle =
            glow;


        ctx.beginPath();


        ctx.arc(

            this.x,
            this.y,

            size * 4,

            0,
            Math.PI * 2
        );


        ctx.fill();


        /*
        ========================================================
        BRIGHT CENTER
        ========================================================
        */

        ctx.globalAlpha =
            alpha;


        ctx.beginPath();


        ctx.arc(

            this.x,
            this.y,

            size * 0.42,

            0,
            Math.PI * 2
        );


        ctx.fillStyle =
            this.color;


        ctx.fill();


        /*
        ========================================================
        HORIZONTAL RAY
        ========================================================
        */

        ctx.globalAlpha =
            alpha * 0.42;


        ctx.strokeStyle =
            this.color;


        ctx.lineWidth =
            0.55;


        ctx.beginPath();


        ctx.moveTo(

            this.x -
            size * 2.8,

            this.y
        );


        ctx.lineTo(

            this.x +
            size * 2.8,

            this.y
        );


        ctx.stroke();


        /*
        ========================================================
        VERTICAL RAY
        ========================================================
        */

        ctx.beginPath();


        ctx.moveTo(

            this.x,

            this.y -
            size * 2.8
        );


        ctx.lineTo(

            this.x,

            this.y +
            size * 2.8
        );


        ctx.stroke();


        ctx.globalAlpha = 1;
    }

}



/*
38 larger sparkles
*/

const sparkles = [];


for (

    let i = 0;

    i < 38;

    i++

) {

    sparkles.push(
        new Sparkle()
    );
}



/* ============================================================
   RESIZE
============================================================ */

function resize() {

    width =
        window.innerWidth;


    height =
        window.innerHeight;


    canvas.width =
        width;


    canvas.height =
        height;


    canvas.style.width =
        width + "px";


    canvas.style.height =
        height + "px";


    ctx.setTransform(

        1,
        0,
        0,
        1,
        0,
        0
    );
}


window.addEventListener(

    "resize",

    resize
);


resize();



/* ============================================================
   MOUSE
============================================================ */

window.addEventListener(

    "mousemove",

    event => {

        mouse.x =
            event.clientX;

        mouse.y =
            event.clientY;
    }
);


window.addEventListener(

    "mouseleave",

    () => {

        mouse.x = -1000;

        mouse.y = -1000;
    }
);



/* ============================================================
   CLICK
============================================================ */

canvas.addEventListener(

    "click",

    event => {

        const rect =
            canvas.getBoundingClientRect();


        const x =
            event.clientX -
            rect.left;


        const y =
            event.clientY -
            rect.top;


        for (

            let i =
                nodes.length - 1;

            i >= 0;

            i--

        ) {

            const node =
                nodes[i];


            if (

                node.containsPoint(
                    x,
                    y
                )

            ) {

                if (

                    node.url &&
                    node.url !== "#"

                ) {

                    if (

                        node.url.startsWith(
                            "http"
                        )

                    ) {

                        window.open(

                            node.url,

                            "_blank",

                            "noopener,noreferrer"
                        );

                    } else {

                        window.location.href =
                            node.url;
                    }
                }


                return;
            }
        }
    }
);



/* ============================================================
   CURSOR
============================================================ */

canvas.addEventListener(

    "mousemove",

    event => {

        const rect =
            canvas.getBoundingClientRect();


        const x =
            event.clientX -
            rect.left;


        const y =
            event.clientY -
            rect.top;


        let hovering = false;


        for (

            const node of nodes

        ) {

            if (

                node.containsPoint(
                    x,
                    y
                )

            ) {

                hovering = true;

                break;
            }
        }


        canvas.style.cursor =

            hovering

                ? "pointer"

                : "default";
    }
);



/* ============================================================
   ANIMATION
============================================================ */

function animate(time) {


    /*
    ========================================================
    CLEAR
    ========================================================
    */

    ctx.globalAlpha = 1;


    ctx.clearRect(

        0,
        0,

        width,
        height
    );


    /*
    ========================================================
    GLITTER
    ========================================================
    */

    for (

        const particle of glitter

    ) {

        particle.update();

        particle.draw();
    }


    /*
    ========================================================
    LARGE SPARKLES
    ========================================================
    */

    for (

        const sparkle of sparkles

    ) {

        sparkle.update(time);

        sparkle.draw(time);
    }


    /*
    ========================================================
    UPDATE NODES
    ========================================================
    */

    for (

        const node of nodes

    ) {

        node.update(time);
    }


    /*
    ========================================================
    TENDRILS
    ========================================================
    */

    ctx.globalAlpha = 1;


    for (

        const tendril of tendrils

    ) {

        tendril.draw(time);
    }


    /*
    ========================================================
    NODES
    ========================================================
    */

    ctx.globalAlpha = 1;


    for (

        const node of nodes

    ) {

        node.draw(time);
    }


    /*
    RESET
    */

    ctx.globalAlpha = 1;

    ctx.shadowBlur = 0;

    ctx.shadowColor =
        "transparent";


    requestAnimationFrame(
        animate
    );
}



/* ============================================================
   START
============================================================ */

requestAnimationFrame(
    animate
);

</script>
