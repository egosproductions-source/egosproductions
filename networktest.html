/* ============================================================
   NODE
============================================================ */

class InteractiveNode {

    constructor(config, index = 0) {

        this.id = config.id;
        this.label = config.label;
        this.url = config.url;

        this.color = config.color;
        this.glow = config.glow;

        this.radius = config.size || 8;

        this.isBold = config.bold || false;
        this.primary = config.primary || false;
        this.home = config.home || false;

        this.fixedX = config.fixedX;
        this.fixedY = config.fixedY;

        this.index = index;

        this.baseAngle =
            config.angle !== undefined
                ? config.angle
                : Math.random() * Math.PI * 2;

        this.distance =
            config.distance ||
            110 + Math.random() * 210;

        this.phase =
            Math.random() * Math.PI * 2;

        this.x = 0;
        this.y = 0;

        this.hoverScale = 0;
    }


    update(time) {

        const cx = width / 2;
        const cy = height / 2;


        if (this.primary) {

            this.x =
                width * this.fixedX;

            this.y =
                height * this.fixedY;


            if (!this.home) {

                this.x +=
                    Math.sin(
                        time * 0.0004 +
                        this.phase
                    ) * 2;

                this.y +=
                    Math.cos(
                        time * 0.00035 +
                        this.phase
                    ) * 2;
            }

        } else {

            const orbit =
                this.baseAngle +
                Math.sin(
                    time * 0.00012 +
                    this.phase
                ) * 0.10;

            const distance =
                this.distance +
                Math.sin(
                    time * 0.00015 +
                    this.phase
                ) * 12;

            this.x =
                cx +
                Math.cos(orbit) *
                distance;

            this.y =
                cy +
                Math.sin(orbit) *
                distance *
                0.72;
        }


        const dx =
            mouse.x - this.x;

        const dy =
            mouse.y - this.y;

        const distance =
            Math.hypot(dx, dy);

        const target =
            distance <
            this.radius + 35
                ? 1
                : 0;

        this.hoverScale +=
            (target - this.hoverScale) *
            0.12;
    }


    draw(time) {

        const pulse =
            Math.sin(
                time * 0.002 +
                this.phase
            ) * 0.5 + 0.5;


        /*
        GLOW
        */

        ctx.globalAlpha =
            0.10 +
            pulse * 0.08 +
            this.hoverScale * 0.12;

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            this.radius +
            6 +
            this.hoverScale * 10,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = this.glow;
        ctx.fill();


        /*
        CORE
        */

        ctx.globalAlpha = 1;

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            this.radius +
            this.hoverScale * 3,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = this.color;
        ctx.fill();


        /*
        CENTER
        */

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            Math.max(
                1.5,
                this.radius * 0.34
            ),
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "rgba(255,255,255,0.82)";

        ctx.globalAlpha =
            0.55 +
            pulse * 0.3;

        ctx.fill();


        /*
        LABEL
        */

        ctx.globalAlpha = 1;

        const labelAngle =
            Math.atan2(
                this.y - height / 2,
                this.x - width / 2
            );

        const labelDistance =
            this.radius +
            19 +
            this.hoverScale * 7;

        const lx =
            this.x +
            Math.cos(labelAngle) *
            labelDistance;

        const ly =
            this.y +
            Math.sin(labelAngle) *
            labelDistance;

        ctx.fillStyle =
            this.color === palette.white
                ? "#f8fafc"
                : this.color;

        ctx.font =
            this.isBold
                ? "600 14px 'Trebuchet MS', 'Segoe UI', sans-serif"
                : "500 11px 'Trebuchet MS', 'Segoe UI', sans-serif";

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        ctx.shadowBlur = 8;
        ctx.shadowColor = this.color;

        ctx.fillText(
            this.label,
            lx,
            ly
        );

        ctx.shadowBlur = 0;
    }


    containsPoint(x, y) {

        return (
            Math.hypot(
                x - this.x,
                y - this.y
            ) <
            this.radius + 18
        );
    }
}


/* ============================================================
   TENDRIL
============================================================ */

class Tendril {

    constructor(a, b, options = {}) {

        this.a = a;
        this.b = b;

        this.phase =
            Math.random() *
            Math.PI * 2;

        this.wave =
            options.wave ||
            35 + Math.random() * 45;

        this.speed =
            0.0003 +
            Math.random() * 0.0003;

        this.alpha =
            options.alpha ||
            0.12;
    }


    draw(time) {

        const ax = this.a.x;
        const ay = this.a.y;

        const bx = this.b.x;
        const by = this.b.y;

        const dx = bx - ax;
        const dy = by - ay;

        const distance =
            Math.hypot(dx, dy);

        if (!distance) return;

        const nx =
            -dy / distance;

        const ny =
            dx / distance;

        const wave =
            Math.sin(
                time * this.speed +
                this.phase
            ) *
            this.wave;

        const c1x =
            ax +
            dx * 0.18 +
            nx * wave;

        const c1y =
            ay +
            dy * 0.18 +
            ny * wave;

        const c2x =
            ax +
            dx * 0.72 -
            nx * wave * 1.25;

        const c2y =
            ay +
            dy * 0.72 -
            ny * wave * 1.25;


        ctx.beginPath();

        ctx.moveTo(ax, ay);

        ctx.bezierCurveTo(
            c1x,
            c1y,
            c2x,
            c2y,
            bx,
            by
        );

        ctx.strokeStyle =
            "rgba(130,100,255,0.035)";

        ctx.lineWidth = 3;

        ctx.stroke();


        ctx.beginPath();

        ctx.moveTo(ax, ay);

        ctx.bezierCurveTo(
            c1x,
            c1y,
            c2x,
            c2y,
            bx,
            by
        );

        ctx.strokeStyle =
            `rgba(190,175,255,${this.alpha})`;

        ctx.lineWidth = 0.65;

        ctx.stroke();
    }
}


/* ============================================================
   NODES
============================================================ */

const nodes = [];

navigationNodes.forEach(
    (config, index) => {

                primaryNodes[j],

                        0.105

) {

    for (

                    b,
                    {

                            28 +
                            Math.random() * 42,

                        alpha:
                            0.075 +
                            Math.random() * 0.045
                    }
                )
            );
        }
    }
}


outerNodes.forEach(
    config => {

        const outer =
            nodes.find(
                node =>
                    node.id === config.id
            );

        const possible =
            primaryNodes.slice();

        possible.sort(
            () =>
                Math.random() - 0.5
        );

        possible
            .slice(0, 2)
            .forEach(
                target => {

                    tendrils.push(
                        new Tendril(
                            outer,
                            target,
                            {
                                wave:
                                    55 +
                                    Math.random() * 35,

                                alpha:
                                    0.09
                            }
                        )

                }
            );
    }

/* ============================================================
   ATMOSPHERIC GLITTER
============================================================ */

class Glitter {

    constructor() {

        this.x =
            Math.random() * width;

        this.y =
            Math.random() * height;

        this.size =
            0.5 +
            Math.random() * 1.6;

        this.phase =
            Math.random() *
            Math.PI * 2;

        this.speed =
            0.0008 +
            Math.random() * 0.002;

        this.drift =
            0.05 +
            Math.random() * 0.18;

        const colors = [
            palette.white,
            palette.blue,
            palette.purple,
            palette.orange
        ];

        this.color =
            colors[
                Math.floor(
                    Math.random() *
                    colors.length
                )
            ];
    }


    update(time) {

        this.x +=
            Math.sin(
                time * 0.0002 +
                this.phase
            ) *
            this.drift;

        this.y +=
            Math.cos(
                time * 0.00016 +
                this.phase
            ) *
            this.drift *
            0.7;


        if (this.x < -5)
            this.x = width + 5;

        if (this.x > width + 5)
            this.x = -5;

        if (this.y < -5)
            this.y = height + 5;

        if (this.y > height + 5)
            this.y = -5;
    }


    draw(time) {

        const pulse =
            Math.sin(
                time * this.speed +
                this.phase
            ) * 0.5 + 0.5;


        ctx.globalAlpha =
            0.20 +
            pulse * 0.65;

        ctx.fillStyle =
            this.color;

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            this.size +
            pulse * 0.8,
            0,
            Math.PI * 2
        );

        ctx.fill();


        /*
        Tiny halo
        */

        if (pulse > 0.72) {

            ctx.globalAlpha =
                0.10 * pulse;

            ctx.beginPath();

            ctx.arc(
                this.x,
                this.y,
                this.size * 3.5,
                0,
                Math.PI * 2
            );

            ctx.fill();

        }
    }
}


const glitter = [];

for (
    let i = 0;
    i < 180;
    i++
) {

    glitter.push(
        new Glitter()
    );
}


/* ============================================================
   LARGE MAGICAL SPARKLES
============================================================ */

class Sparkle {

    constructor() {

        this.x =
            Math.random() * width;

        this.y =
            Math.random() * height;

        this.size =
            2 +
            Math.random() * 4;

        this.phase =
            Math.random() *
            Math.PI * 2;

        this.speed =
            0.001 +
            Math.random() * 0.002;

        this.drift =
            0.04 +
            Math.random() * 0.10;

        const colors = [
            palette.white,
            palette.blue,
            palette.purple,
            palette.orange
        ];

        this.color =
            colors[
                Math.floor(
                    Math.random() *
                    colors.length
                )
            ];
    }


    update(time) {

        this.x +=
            Math.sin(
                time * 0.00013 +
                this.phase
            ) *
            this.drift;

        this.y +=
            Math.cos(
                time * 0.00011 +
                this.phase
            ) *
            this.drift;


        if (this.x < -20)
            this.x = width + 20;

        if (this.x > width + 20)
            this.x = -20;

        if (this.y < -20)
            this.y = height + 20;

        if (this.y > height + 20)
            this.y = -20;
    }


    draw(time) {

        const pulse =
            Math.sin(
                time * this.speed +
                this.phase
            ) * 0.5 + 0.5;


        const size =
            this.size *
            (
                0.3 +
                pulse
            );


        const alpha =
            0.10 +
            pulse * 0.65;


        /*
        Glow
        */

        ctx.globalAlpha =
            alpha * 0.10;

        ctx.fillStyle =
            this.color;

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            size * 3,
            0,
            Math.PI * 2
        );

        ctx.fill();


        /*
        Center
        */

        ctx.globalAlpha =
            alpha;

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            size * 0.45,
            0,
            Math.PI * 2
        );

        ctx.fill();


        /*
        Horizontal ray
        */

        ctx.globalAlpha =
            alpha * 0.45;

        ctx.strokeStyle =
            this.color;

        ctx.lineWidth = 0.5;

        ctx.beginPath();

        ctx.moveTo(
            this.x - size * 2.8,
            this.y
        );

        ctx.lineTo(
            this.x + size * 2.8,
            this.y
        );

        ctx.stroke();


        /*
        Vertical ray
        */

        ctx.beginPath();

        ctx.moveTo(
            this.x,
            this.y - size * 2.8
        );

        ctx.lineTo(
            this.x,
            this.y + size * 2.8
        );

        ctx.stroke();
    }
}


const sparkles = [];

for (
    let i = 0;
    i < 38;
    i++
) {

    sparkles.push(
        new Sparkle()
    );
}


/* ============================================================
   RESIZE
============================================================ */

function resize() {

    width =
        window.innerWidth;

    height =
        window.innerHeight;

    canvas.width =
        width;

    canvas.height =
        height;

    canvas.style.width =
        width + "px";

    canvas.style.height =
        height + "px";

    ctx.setTransform(
        1,
        0,
        0,
        1,
        0,
        0
    );
}

window.addEventListener(
    "resize",
    resize
);

resize();


/* ============================================================
   MOUSE
============================================================ */

window.addEventListener(
    "mousemove",
    event => {

        mouse.x =
            event.clientX;

        mouse.y =
            event.clientY;
    }
);

window.addEventListener(
    "mouseleave",
    () => {

        mouse.x = -1000;
        mouse.y = -1000;
    }
);


/* ============================================================
   CLICK
============================================================ */

canvas.addEventListener(
    "click",
    event => {

        const rect =
            canvas.getBoundingClientRect();

        const x =
            event.clientX -
            rect.left;

        const y =
            event.clientY -
            rect.top;


        for (
            let i = nodes.length - 1;
            i >= 0;
            i--
        ) {

            const node =
                nodes[i];

            if (
                node.containsPoint(
                    x,
                    y
                )
            ) {

                if (
                    node.url &&
                    node.url !== "#"
                ) {

                    if (
                        node.url.startsWith(
                            "http"
                        )
                    ) {

                        window.open(
                            node.url,
                            "_blank",
                            "noopener,noreferrer"
                        );

                    } else {

                        window.location.href =
                            node.url;
                    }
                }

                return;
            }
        }
    }
);


/* ============================================================
   CURSOR
============================================================ */

canvas.addEventListener(
    "mousemove",
    event => {

        const rect =
            canvas.getBoundingClientRect();

        const x =
            event.clientX -
            rect.left;

        const y =
            event.clientY -
            rect.top;

        let hovering = false;

        for (
            const node of nodes
        ) {

            if (
                node.containsPoint(
                    x,
                    y
                )
            ) {

                hovering = true;
                break;
            }
        }

        canvas.style.cursor =
            hovering
                ? "pointer"
                : "default";
    }
);


/* ============================================================
   BACKGROUND
============================================================ */

function drawBackground() {

    ctx.globalAlpha = 1;

    const gradient =
        ctx.createRadialGradient(
            width * 0.50,
            height * 0.50,
            0,
            width * 0.50,
            height * 0.50,
            Math.max(width, height) * 0.80
        );

    gradient.addColorStop(
        0,
        "rgba(76,29,149,0.18)"
    );

    gradient.addColorStop(
        0.35,
        "rgba(29,78,216,0.07)"
    );

    gradient.addColorStop(
        0.70,
        "rgba(15,5,30,0.08)"
    );

    gradient.addColorStop(
        1,
        "#03030a"
    );

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        width,
        height
    );
}


/* ============================================================
   ANIMATION
============================================================ */

function animate(time) {

    /*
    RESET CANVAS STATE
    */

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation =
        "source-over";


    /*
    CLEAR
    */

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    /*
    BACKGROUND
    */

    drawBackground();


    /*
    ========================================================
    ATMOSPHERE
    ========================================================
    */

    for (
        const particle of glitter
    ) {

        particle.update(time);
        particle.draw(time);
    }


    for (
        const sparkle of sparkles
    ) {

        sparkle.update(time);
        sparkle.draw(time);
    }


    /*
    ========================================================
    NETWORK
    ========================================================
    */

    ctx.globalAlpha = 1;

    for (
        const node of nodes
    ) {

        node.update(time);
    }


    for (
        const tendril of tendrils
    ) {

        tendril.draw(time);
    }


    for (
        const node of nodes
    ) {

        node.draw(time);
    }


    /*
    RESET
    */

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation =
        "source-over";


    requestAnimationFrame(
        animate
    );
}


/* ============================================================
   START
============================================================ */

requestAnimationFrame(
    animate
);

</script>

</body>
