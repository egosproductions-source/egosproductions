/* ============================================================
   NODE
============================================================ */

class InteractiveNode {

    constructor(config, index = 0) {

        this.id =
            config.id;

        this.label =
            config.label;

        this.url =
            config.url;

        this.color =
            config.color;

        this.glow =
            config.glow;

        this.radius =
            config.size || 8;

        this.isBold =
            config.bold || false;

        this.primary =
            config.primary || false;

        this.home =
            config.home || false;

        this.fixedX =
            config.fixedX;

        this.fixedY =
            config.fixedY;

        this.index =
            index;

        this.baseAngle =
            config.angle !== undefined
                ? config.angle
                : Math.random() * Math.PI * 2;

        this.distance =
            config.distance ||
            110 + Math.random() * 210;

        this.phase =
            Math.random() * Math.PI * 2;

        this.x = 0;
        this.y = 0;

        this.hoverScale = 0;
    }


    update(time) {

        const cx =
            width / 2;

        const cy =
            height / 2;


        /*
        PRIMARY NODES
        */

        if (this.primary) {

            this.x =
                width * this.fixedX;

            this.y =
                height * this.fixedY;


            /*
            Very tiny breathing movement
            */

            if (!this.home) {

                this.x +=
                    Math.sin(
                        time * 0.0004 +
                        this.phase
                    ) * 2;

                this.y +=
                    Math.cos(
                        time * 0.00035 +
                        this.phase
                    ) * 2;
            }
        }


        /*
        SMALLER NODES
        */

        else {

            const orbit =
                this.baseAngle +
                Math.sin(
                    time * 0.00012 +
                    this.phase
                ) * 0.10;


            const distance =
                this.distance +
                Math.sin(
                    time * 0.00015 +
                    this.phase
                ) * 12;


            this.x =
                cx +
                Math.cos(orbit) *
                distance;

            this.y =
                cy +
                Math.sin(orbit) *
                distance *
                0.72;
        }


        /*
        HOVER
        */

        const dx =
            mouse.x - this.x;

        const dy =
            mouse.y - this.y;

        const distance =
            Math.hypot(dx, dy);


        const target =
            distance <
            this.radius + 35
                ? 1
                : 0;


        this.hoverScale +=
            (target - this.hoverScale) *
            0.12;
    }


    draw(time) {

        const pulse =
            Math.sin(
                time * 0.002 +
                this.phase
            ) * 0.5 + 0.5;


        /*
        SOFT OUTER GLOW
        */

        ctx.globalAlpha =
            0.10 +
            pulse * 0.08 +
            this.hoverScale * 0.12;

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,

            this.radius +
            6 +
            this.hoverScale * 10,

            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            this.glow;

        ctx.fill();


        /*
        CORE
        */

        ctx.globalAlpha = 1;

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,

            this.radius +
            this.hoverScale * 3,

            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            this.color;

        ctx.fill();


        /*
        WHITE CENTER
        */

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,

            Math.max(
                1.5,
                this.radius * 0.34
            ),

            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "rgba(255,255,255,0.82)";

        ctx.globalAlpha =
            0.55 +
            pulse * 0.3;

        ctx.fill();


        /*
        LABEL
        */

        ctx.globalAlpha = 1;

        const labelAngle =
            Math.atan2(
                this.y - height / 2,
                this.x - width / 2
            );


        const labelDistance =
            this.radius +
            19 +
            this.hoverScale * 7;


        const lx =
            this.x +
            Math.cos(labelAngle) *
            labelDistance;


        const ly =
            this.y +
            Math.sin(labelAngle) *
            labelDistance;


        ctx.fillStyle =
            this.color === palette.white
                ? "#f8fafc"
                : this.color;


        ctx.font =
            this.isBold
                ? "600 14px 'Trebuchet MS', 'Segoe UI', sans-serif"
                : "500 11px 'Trebuchet MS', 'Segoe UI', sans-serif";


        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";


        ctx.shadowBlur = 8;

        ctx.shadowColor =
            this.color;


        ctx.fillText(
            this.label,
            lx,
            ly
        );


        ctx.shadowBlur = 0;
    }


    containsPoint(x, y) {

        return (
            Math.hypot(
                x - this.x,
                y - this.y
            ) <
            this.radius + 18
        );
    }

}


/* ============================================================
   TENDRIL
============================================================ */

class Tendril {

    constructor(a, b, options = {}) {

        this.a = a;
        this.b = b;

        this.phase =
            Math.random() *
            Math.PI * 2;

        /*
        Larger wave = much more obvious curve
        */

        this.wave =
            options.wave ||
            35 + Math.random() * 45;

        this.speed =
            0.0003 +
            Math.random() * 0.0003;

        this.alpha =
            options.alpha ||
            0.12;
    }


    draw(time) {

        const ax =
            this.a.x;

        const ay =
            this.a.y;

        const bx =
            this.b.x;

        const by =
            this.b.y;


        const dx =
            bx - ax;

        const dy =
            by - ay;


        const distance =
            Math.hypot(
                dx,
                dy
            );


        if (!distance) {
            return;
        }


        /*
        PERPENDICULAR DIRECTION
        */

        const nx =
            -dy / distance;

        const ny =
            dx / distance;


        /*
        SLOWLY MOVING WAVE
        */

        const wave =
            Math.sin(
                time * this.speed +
                this.phase
            ) *
            this.wave;


        /*
        TWO DIFFERENT CONTROL
        POINT OFFSETS

        This makes the tendrils
        visibly snake instead of
        looking like bent straight
        lines.
        */

        const c1x =
            ax +
            dx * 0.18 +
            nx * wave;

        const c1y =
            ay +
            dy * 0.18 +
            ny * wave;


        const c2x =
            ax +
            dx * 0.72 -
            nx * wave * 1.25;

        const c2y =
            ay +
            dy * 0.72 -
            ny * wave * 1.25;


        /*
        SECONDARY SOFT LINE
        */

        ctx.beginPath();

        ctx.moveTo(
            ax,
            ay
        );

        ctx.bezierCurveTo(
            c1x,
            c1y,
            c2x,
            c2y,
            bx,
            by
        );

        ctx.strokeStyle =
            "rgba(130,100,255,0.035)";

        ctx.lineWidth =
            3;

        ctx.stroke();


        /*
        MAIN CURVE
        */

        ctx.beginPath();

        ctx.moveTo(
            ax,
            ay
        );

        ctx.bezierCurveTo(
            c1x,
            c1y,
            c2x,
            c2y,
            bx,
            by
        );

        ctx.strokeStyle =
            `rgba(190,175,255,${this.alpha})`;

        ctx.lineWidth =
            0.65;

        ctx.stroke();
    }
}


/* ============================================================
   NODES
============================================================ */

const nodes = [];


navigationNodes.forEach(
    (config, index) => {

        nodes.push(
            new InteractiveNode(
                config,
                index
            )
        );
    }
);


outerNodes.forEach(
    (config, index) => {

        nodes.push(
            new InteractiveNode(
                config,
                navigationNodes.length +
                index
            )
        );
    }
);


/* ============================================================
   TENDRILS
============================================================ */

const tendrils = [];


/*
MAIN SIX NODES
*/

const primaryNodes =
    nodes.filter(
        node =>
            node.primary &&
            !node.home
    );


/*
CONNECT MAIN NODES
TO EACH OTHER

HOME IS DELIBERATELY
NOT INCLUDED.
*/

for (
    let i = 0;
    i < primaryNodes.length;
    i++
) {

    for (
        let j = i + 1;
        j < primaryNodes.length;
        j++
    ) {

        tendrils.push(
            new Tendril(
                primaryNodes[i],
                primaryNodes[j],
                {
                    wave:
                        45 +
                        Math.random() * 35,

                    alpha:
                        0.105
                }
            )
        );
    }
}


/*
SMALLER WEB NODES
*/

const webNodes =
    nodes.filter(
        node =>
            !node.home
    );


/*
Only create a controlled
number of extra connections.

This is what keeps the
animation fast.
*/

for (
    let i = 0;
    i < webNodes.length;
    i++
) {

    for (
        let j = i + 1;
        j < webNodes.length;
        j++
    ) {

        const a =
            webNodes[i];

        const b =
            webNodes[j];


        /*
        Don't duplicate primary
        connections.
        */

        if (
            a.primary &&
            b.primary
        ) {
            continue;
        }


        /*
        Random sparse network
        */

        if (
            Math.random() <
            0.34
        ) {

            tendrils.push(
                new Tendril(
                    a,
                    b,
                    {
                        wave:
                            28 +
                            Math.random() * 42,

                        alpha:
                            0.075 +
                            Math.random() * 0.045
                    }
                )
            );
        }
    }
}


/*
EXTRA CURVES AROUND
THE OUTSIDE NODES
*/

outerNodes.forEach(
    config => {

        const outer =
            nodes.find(
                node =>
                    node.id ===
                    config.id
            );

        const possible =
            primaryNodes.slice();


        possible.sort(
            () =>
                Math.random() - 0.5
        );


        /*
        Each outer node gets
        two connections.
        */

        possible
            .slice(0, 2)
            .forEach(
                target => {

                    tendrils.push(
                        new Tendril(
                            outer,
                            target,
                            {
                                wave:
                                    55 +
                                    Math.random() * 35,

                                alpha:
                                    0.09
                            }
                        )
                    );
                }
            );
    }
);


/* ============================================================
   MOVING GLITTER
============================================================ */

class Glitter {

    constructor() {
        this.reset(true);
    }

    reset(initial = false) {

        this.x = Math.random() * width;
        this.y = Math.random() * height;

        this.size =
            0.4 + Math.random() * 1.8;

        this.phase =
            Math.random() * Math.PI * 2;

        this.speed =
            0.0008 + Math.random() * 0.002;

        this.driftX =
            (Math.random() - 0.5) * 0.035;

        this.driftY =
            (Math.random() - 0.5) * 0.025;

        this.alpha =
            0.18 + Math.random() * 0.55;

        const colors = [
            palette.white,
            palette.blue,
            palette.purple,
            palette.orange
        ];

        this.color =
            colors[
                Math.floor(
                    Math.random() * colors.length
                )
            ];

        if (!initial) {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
        }
    }

    update(time) {

        /*
        Slow drifting movement
        */

        this.x += this.driftX;
        this.y += this.driftY;

        /*
        Gentle floating wave
        */

        this.x +=
            Math.sin(
                time * 0.00018 +
                this.phase
            ) * 0.10;

        this.y +=
            Math.cos(
                time * 0.00015 +
                this.phase
            ) * 0.08;


        /*
        Wrap around screen
        */

        if (this.x < -10) {
            this.x = width + 10;
        }

        if (this.x > width + 10) {
            this.x = -10;
        }

        if (this.y < -10) {
            this.y = height + 10;
        }

        if (this.y > height + 10) {
            this.y = -10;
        }
    }

    draw(time) {

        /*
        Twinkling
        */

        const pulse =
            Math.sin(
                time * this.speed +
                this.phase
            ) * 0.5 + 0.5;


        const opacity =
            this.alpha *
            (
                0.25 +
                pulse * 0.75
            );


        /*
        Main tiny star
        */

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,

            this.size +
            pulse * 0.9,

            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            this.color;

        ctx.globalAlpha =
            opacity;

        ctx.fill();


        /*
        Soft atmospheric glow
        */

        if (
            pulse > 0.68 &&
            this.size > 0.9
        ) {

            ctx.beginPath();

            ctx.arc(
                this.x,
                this.y,

                this.size * 3.5,

                0,
                Math.PI * 2
            );

            ctx.fillStyle =
                this.color;

            ctx.globalAlpha =
                opacity * 0.12;

            ctx.fill();
        }
    }
}


/*
More background atmosphere
*/

const glitter = [];

for (
    let i = 0;
    i < 180;
    i++
) {
    glitter.push(
        new Glitter()
    );
}


/* ============================================================
   MOVING LARGE SPARKLES
============================================================ */

class Sparkle {

    constructor() {

        this.x =
            Math.random() * width;

        this.y =
            Math.random() * height;

        this.size =
            1.5 +
            Math.random() * 4.5;

        this.phase =
            Math.random() *
            Math.PI * 2;

        this.speed =
            0.001 +
            Math.random() * 0.0025;

        this.driftX =
            (Math.random() - 0.5) * 0.018;

        this.driftY =
            (Math.random() - 0.5) * 0.015;


        const colors = [
            palette.white,
            palette.blue,
            palette.purple,
            palette.orange
        ];

        this.color =
            colors[
                Math.floor(
                    Math.random() *
                    colors.length
                )
            ];
    }


    update(time) {

        /*
        Slow floating movement
        */

        this.x +=
            this.driftX +
            Math.sin(
                time * 0.00013 +
                this.phase
            ) * 0.08;

        this.y +=
            this.driftY +
            Math.cos(
                time * 0.00011 +
                this.phase
            ) * 0.06;


        /*
        Wrap around
        */

        if (this.x < -20) {
            this.x = width + 20;
        }

        if (this.x > width + 20) {
            this.x = -20;
        }

        if (this.y < -20) {
            this.y = height + 20;
        }

        if (this.y > height + 20) {
            this.y = -20;
        }
    }


    draw(time) {

        const pulse =
            Math.sin(
                time * this.speed +
                this.phase
            ) * 0.5 + 0.5;


        const size =
            this.size *
            (
                0.35 +
                pulse * 0.95
            );


        const alpha =
            0.08 +
            pulse * 0.62;


        /*
        Soft glow
        */

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,

            size * 2.5,

            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            this.color;

        ctx.globalAlpha =
            alpha * 0.07;

        ctx.fill();


        /*
        Bright center
        */

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,

            size * 0.45,

            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            this.color;

        ctx.globalAlpha =
            alpha;

        ctx.fill();


        /*
        Horizontal shimmer
        */

        ctx.beginPath();

        ctx.moveTo(
            this.x - size * 2.8,
            this.y
        );

        ctx.lineTo(
            this.x + size * 2.8,
            this.y
        );

        ctx.strokeStyle =
            this.color;

        ctx.globalAlpha =
            alpha * 0.38;

        ctx.lineWidth =
            0.5;

        ctx.stroke();


        /*
        Vertical shimmer
        */

        ctx.beginPath();

        ctx.moveTo(
            this.x,
            this.y - size * 2.8
        );

        ctx.lineTo(
            this.x,
            this.y + size * 2.8
        );

        ctx.strokeStyle =
            this.color;

        ctx.globalAlpha =
            alpha * 0.38;

        ctx.stroke();
    }
}


/*
Background magical sparkles
*/

const sparkles = [];

for (
    let i = 0;
    i < 38;
    i++
) {
    sparkles.push(
        new Sparkle()
    );
}

/* ============================================================
   RESIZE
============================================================ */

function resize() {

    width =
        window.innerWidth;

    height =
        window.innerHeight;


    /*
    Keep this at 1 for performance.
    */

    dpr = 1;


    canvas.width =
        width;

    canvas.height =
        height;


    canvas.style.width =
        width + "px";

    canvas.style.height =
        height + "px";


    ctx.setTransform(
        1,
        0,
        0,
        1,
        0,
        0
    );
}


window.addEventListener(
    "resize",
    resize
);


resize();


/* ============================================================
   MOUSE
============================================================ */

window.addEventListener(
    "mousemove",
    event => {

        mouse.x =
            event.clientX;

        mouse.y =
            event.clientY;
    }
);


window.addEventListener(
    "mouseleave",
    () => {

        mouse.x = -1000;
        mouse.y = -1000;
    }
);


/* ============================================================
   CLICK
============================================================ */

canvas.addEventListener(
    "click",
    event => {

        const rect =
            canvas.getBoundingClientRect();


        const x =
            event.clientX -
            rect.left;


        const y =
            event.clientY -
            rect.top;


        for (
            let i = nodes.length - 1;
            i >= 0;
            i--
        ) {

            const node =
                nodes[i];


            if (
                node.containsPoint(
                    x,
                    y
                )
            ) {

                if (
                    node.url &&
                    node.url !== "#"
                ) {

                    if (
                        node.url.startsWith(
                            "http"
                        )
                    ) {

                        window.open(
                            node.url,
                            "_blank",
                            "noopener,noreferrer"
                        );

                    } else {

                        window.location.href =
                            node.url;
                    }
                }

                return;
            }
        }
    }
);


/* ============================================================
   CURSOR
============================================================ */

canvas.addEventListener(
    "mousemove",
    event => {

        const rect =
            canvas.getBoundingClientRect();


        const x =
            event.clientX -
            rect.left;


        const y =
            event.clientY -
            rect.top;


        let hovering = false;


        for (
            const node of nodes
        ) {

            if (
                node.containsPoint(
                    x,
                    y
                )
            ) {

                hovering = true;

                break;
            }
        }


        canvas.style.cursor =
            hovering
                ? "pointer"
                : "default";
    }
);


/function drawBackground() {

    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;

    /*
    Deep atmospheric background
    */

    const gradient =
        ctx.createRadialGradient(
            width * 0.50,
            height * 0.50,
            0,

            width * 0.50,
            height * 0.50,

            Math.max(width, height) * 0.85
        );

    gradient.addColorStop(
        0,
        "rgba(76,29,149,0.20)"
    );

    gradient.addColorStop(
        0.35,
        "rgba(29,78,216,0.09)"
    );

    gradient.addColorStop(
        0.70,
        "rgba(20,8,35,0.12)"
    );

    gradient.addColorStop(
        1,
        "rgba(3,3,10,1)"
    );

    ctx.fillStyle = gradient;

    ctx.fillRect(
        0,
        0,
        width,
        height
    );
}
/* ============================================================
   ANIMATION
============================================================ */

function animate(time) {

    /*
    Clear
    */

    ctx.globalAlpha = 1;

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    /*
    Background
    */

    drawBackground();


   function animate(time) {

    /*
    Reset canvas state
    */

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
    ctx.shadowBlur = 0;
    ctx.shadowColor = "transparent";


    /*
    Clear
    */

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    /*
    Background atmosphere
    */

    drawBackground();


    /*
    ========================================================
    MOVING GLITTER
    ========================================================
    */

    ctx.globalCompositeOperation = "screen";

    for (
        const particle of glitter
    ) {

        particle.update(time);

        particle.draw(time);
    }


    /*
    ========================================================
    LARGE SPARKLES
    ========================================================
    */

    for (
        const sparkle of sparkles
    ) {

        sparkle.update(time);

        sparkle.draw(time);
    }


    /*
    Reset before network
    */

    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;


    /*
    ========================================================
    UPDATE NODES
    ========================================================
    */

    for (
        const node of nodes
    ) {

        node.update(time);
    }


    /*
    ========================================================
    TENDRILS
    ========================================================
    */

    ctx.globalAlpha = 1;

    for (
        const tendril of tendrils
    ) {

        tendril.draw(time);
    }


    /*
    ========================================================
    NODES
    ========================================================
    */

    ctx.globalAlpha = 1;

    for (
        const node of nodes
    ) {

        node.draw(time);
    }


    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";


    requestAnimationFrame(
        animate
    );
}

    /*
    TENDRILS
    */

    ctx.globalAlpha = 1;

    for (
        const tendril of tendrils
    ) {

        tendril.draw(time);
    }


    /*
    NODES
    */

    ctx.globalAlpha = 1;

    for (
        const node of nodes
    ) {

        node.draw(time);
    }


    ctx.globalAlpha = 1;


    requestAnimationFrame(
        animate
    );
}


/* ============================================================
   START
============================================================ */

requestAnimationFrame(
    animate
);

</script>
