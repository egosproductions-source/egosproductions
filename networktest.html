/* =========================================================
   INTERACTIVE NODE
========================================================= */

class InteractiveNode {

    constructor(config) {

        this.id =
            config.id;

        this.label =
            config.label;

        this.url =
            config.url;

        this.color =
            config.color;

        this.glow =
            config.glow;

        this.radius =
            config.size || 8;

        this.isBold =
            config.bold || false;

        this.primary =
            config.primary || false;

        this.home =
            config.home || false;

        this.fixedX =
            config.fixedX;

        this.fixedY =
            config.fixedY;

        this.distance =
            config.distance || 180;

        this.baseAngle =
            config.angle !== undefined
                ? config.angle
                : Math.random() * Math.PI * 2;

        this.phase =
            Math.random() * Math.PI * 2;

        this.x = 0;
        this.y = 0;

        this.hoverScale = 0;
    }


    update(time) {

        if (this.primary) {

            this.x =
                width * this.fixedX;

            this.y =
                height * this.fixedY;


            /*
            Keep HOME perfectly still.
            */

            if (!this.home) {

                this.x +=
                    Math.sin(
                        time * 0.0004 +
                        this.phase
                    ) * 2;

                this.y +=
                    Math.cos(
                        time * 0.00035 +
                        this.phase
                    ) * 2;
            }

        } else {

            const angle =
                this.baseAngle +
                Math.sin(
                    time * 0.00012 +
                    this.phase
                ) * 0.10;


            const distance =
                this.distance +
                Math.sin(
                    time * 0.00015 +
                    this.phase
                ) * 10;


            this.x =
                width / 2 +
                Math.cos(angle) *
                distance;

            this.y =
                height / 2 +
                Math.sin(angle) *
                distance *
                0.72;
        }


        const dx =
            mouse.x - this.x;

        const dy =
            mouse.y - this.y;

        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        const target =
            distance <
            this.radius + 35
                ? 1
                : 0;


        this.hoverScale +=
            (target - this.hoverScale) *
            0.12;
    }


    draw(time) {

        const pulse =
            (
                Math.sin(
                    time * 0.002 +
                    this.phase
                ) + 1
            ) * 0.5;


        /*
        OUTER GLOW
        */

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            this.radius +
            12 +
            pulse * 5 +
            this.hoverScale * 8,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            this.glow;

        ctx.globalAlpha =
            0.55 +
            pulse * 0.15;

        ctx.fill();


        /*
        SECOND GLOW
        */

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            this.radius +
            5 +
            this.hoverScale * 4,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            this.glow;

        ctx.globalAlpha =
            0.55;

        ctx.fill();


        /*
        CORE
        */

        ctx.globalAlpha = 1;

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            this.radius +
            this.hoverScale * 3,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            this.color;

        ctx.fill();


        /*
        WHITE CENTER
        */

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            Math.max(
                1.5,
                this.radius * 0.34
            ),
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "#ffffff";

        ctx.globalAlpha =
            0.55 +
            pulse * 0.30;

        ctx.fill();


        /*
        LABEL
        */

        ctx.globalAlpha = 1;

        const angle =
            Math.atan2(
                this.y - height / 2,
                this.x - width / 2
            );


        const labelDistance =
            this.radius +
            20 +
            this.hoverScale * 7;


        const labelX =
            this.x +
            Math.cos(angle) *
            labelDistance;


        const labelY =
            this.y +
            Math.sin(angle) *
            labelDistance;


        ctx.fillStyle =
            this.color === palette.white
                ? "#f8fafc"
                : this.color;


        ctx.font =
            this.isBold
                ? "600 14px 'Trebuchet MS', 'Segoe UI', sans-serif"
                : "500 11px 'Trebuchet MS', 'Segoe UI', sans-serif";


        ctx.textAlign = "center";
        ctx.textBaseline = "middle";


        ctx.shadowBlur = 10;

        ctx.shadowColor =
            this.color;


        ctx.fillText(
            this.label,
            labelX,
            labelY
        );


        ctx.shadowBlur = 0;
    }


    containsPoint(x, y) {

        return Math.hypot(
            x - this.x,
            y - this.y
        ) < this.radius + 18;
    }

}


/* =========================================================
   TENDRIL
========================================================= */

class Tendril {

    constructor(a, b, options = {}) {

        this.a = a;
        this.b = b;

        this.phase =
            Math.random() *
            Math.PI * 2;

        this.wave =
            options.wave ||
            40;

        this.speed =
            0.0003 +
            Math.random() * 0.0003;

        this.alpha =
            options.alpha ||
            0.10;
    }


    draw(time) {

        const ax = this.a.x;
        const ay = this.a.y;

        const bx = this.b.x;
        const by = this.b.y;


        const dx =
            bx - ax;

        const dy =
            by - ay;


        const distance =
            Math.hypot(
                dx,
                dy
            );


        if (!distance) {
            return;
        }


        const nx =
            -dy / distance;

        const ny =
            dx / distance;


        /*
        Smooth moving wave.
        */

        const wave =
            Math.sin(
                time * this.speed +
                this.phase
            ) * this.wave;


        /*
        First control point.
        */

        const c1x =
            ax +
            dx * 0.18 +
            nx * wave;


        const c1y =
            ay +
            dy * 0.18 +
            ny * wave;


        /*
        Second control point moves
        in the opposite direction.
        */

        const c2x =
            ax +
            dx * 0.72 -
            nx * wave * 1.25;


        const c2y =
            ay +
            dy * 0.72 -
            ny * wave * 1.25;


        /*
        VERY SOFT OUTER GLOW
        */

        ctx.beginPath();

        ctx.moveTo(ax, ay);

        ctx.bezierCurveTo(
            c1x,
            c1y,
            c2x,
            c2y,
            bx,
            by
        );

        ctx.strokeStyle =
            "rgba(130,100,255,0.06)";

        ctx.lineWidth = 3;

        ctx.stroke();


        /*
        MAIN LINE
        */

        ctx.beginPath();

        ctx.moveTo(ax, ay);

        ctx.bezierCurveTo(
            c1x,
            c1y,
            c2x,
            c2y,
            bx,
            by
        );

        ctx.strokeStyle =
            `rgba(
                190,
                175,
                255,
                ${this.alpha}
            )`;

        ctx.lineWidth = 0.7;

        ctx.stroke();
    }

}


/* =========================================================
   CREATE ALL NODES
========================================================= */

const nodes = [];


for (const config of navigationNodes) {

    nodes.push(
        new InteractiveNode(config)
    );
}


for (const config of outerNodes) {

    nodes.push(
        new InteractiveNode(config)
    );
}


/* =========================================================
   CREATE TENDRILS
========================================================= */

const tendrils = [];


const primaryNodes =
    nodes.filter(
        node =>
            node.primary &&
            !node.home
    );


/*
Every primary node connects
to every other primary node.
*/

for (
    let i = 0;
    i < primaryNodes.length;
    i++
) {

    for (
        let j = i + 1;
        j < primaryNodes.length;
        j++
    ) {

        tendrils.push(
            new Tendril(
                primaryNodes[i],
                primaryNodes[j],
                {
                    wave:
                        45 +
                        Math.random() * 35,

                    alpha:
                        0.11
                }
            )
        );
    }
}


/*
Additional web connections.
*/

const webNodes =
    nodes.filter(
        node =>
            !node.home
    );


for (
    let i = 0;
    i < webNodes.length;
    i++
) {

    for (
        let j = i + 1;
        j < webNodes.length;
        j++
    ) {

        const a =
            webNodes[i];

        const b =
            webNodes[j];


        if (
            a.primary &&
            b.primary
        ) {
            continue;
        }


        if (
            Math.random() < 0.34
        ) {

            tendrils.push(
                new Tendril(
                    a,
                    b,
                    {
                        wave:
                            30 +
                            Math.random() * 40,

                        alpha:
                            0.075 +
                            Math.random() * 0.05
                    }
                )
            );
        }
    }
}


/*
Outer nodes connect into the
main network.
*/

for (const config of outerNodes) {

    const outer =
        nodes.find(
            node =>
                node.id === config.id
        );


    const shuffled =
        [...primaryNodes].sort(
            () =>
                Math.random() - 0.5
        );


    for (
        const target of
        shuffled.slice(0, 2)
    ) {

        tendrils.push(
            new Tendril(
                outer,
                target,
                {
                    wave:
                        55 +
                        Math.random() * 35,

                    alpha:
                        0.09
                }
            )
        );
    }
}


/* =========================================================
   GLITTER PARTICLES
========================================================= */

class GlitterParticle {

    constructor() {

        this.x =
            Math.random() * width;

        this.y =
            Math.random() * height;


        this.vx =
            (Math.random() - 0.5) *
            0.32;

        this.vy =
            (Math.random() - 0.5) *
            0.32;


        this.size =
            Math.random() * 1.8 +
            0.7;


        this.phase =
            Math.random() *
            Math.PI * 2;


        this.speed =
            0.001 +
            Math.random() * 0.002;


        this.color =
            [
                palette.white,
                palette.blue,
                palette.purple,
                palette.orange
            ][
                Math.floor(
                    Math.random() * 4
                )
            ];
    }


    update(time) {

        this.x += this.vx;
        this.y += this.vy;


        /*
        Gentle organic drift.
        */

        this.x +=
            Math.sin(
                time * 0.00015 +
                this.phase
            ) * 0.025;


        this.y +=
            Math.cos(
                time * 0.00012 +
                this.phase
            ) * 0.025;


        /*
        Wrap around edges.
        */

        if (this.x < -10) {
            this.x = width + 10;
        }

        if (this.x > width + 10) {
            this.x = -10;
        }

        if (this.y < -10) {
            this.y = height + 10;
        }

        if (this.y > height + 10) {
            this.y = -10;
        }
    }


    draw(time) {

        const twinkle =
            (
                Math.sin(
                    time * this.speed +
                    this.phase
                ) + 1
            ) * 0.5;


        /*
        IMPORTANT:
        These values are intentionally
        much brighter than before.
        */

        const alpha =
            0.30 +
            twinkle * 0.65;


        const size =
            this.size *
            (
                0.75 +
                twinkle * 0.9
            );


        /*
        Large visible halo.
        */

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            size * 5,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            this.color;

        ctx.globalAlpha =
            alpha * 0.18;

        ctx.fill();


        /*
        Bright particle.
        */

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            this.color;

        ctx.globalAlpha =
            alpha;

        ctx.fill();


        /*
        White twinkling center.
        */

        if (twinkle > 0.35) {

            ctx.beginPath();

            ctx.arc(
                this.x,
                this.y,
                size * 0.35,
                0,
                Math.PI * 2
            );

            ctx.fillStyle =
                "#ffffff";

            ctx.globalAlpha =
                0.65 +
                twinkle * 0.35;

            ctx.fill();
        }


        ctx.globalAlpha = 1;
    }

}


/* =========================================================
   GLITTER ARRAY
========================================================= */

const glitter = [];


/*
This is intentionally high enough
that the glitter is unmistakable.
*/

const glitterCount =
    Math.min(
        320,
        Math.floor(
            (width * height) / 4500
        )
    );


for (
    let i = 0;
    i < glitterCount;
    i++
) {

    glitter.push(
        new GlitterParticle()
    );
}


/* =========================================================
   LARGE TWINKLING SPARKLES
========================================================= */

class Sparkle {

    constructor() {

        this.x =
            Math.random() * width;

        this.y =
            Math.random() * height;

        this.size =
            2 +
            Math.random() * 4;

        this.phase =
            Math.random() *
            Math.PI * 2;

        this.color =
            [
                palette.white,
                palette.blue,
                palette.purple,
                palette.orange
            ][
                Math.floor(
                    Math.random() * 4
                )
            ];

        this.vx =
            (Math.random() - 0.5) *
            0.08;

        this.vy =
            (Math.random() - 0.5) *
            0.08;
    }


    update(time) {

        this.x += this.vx;
        this.y += this.vy;


        /*
        Very slow floating movement.
        */

        this.x +=
            Math.sin(
                time * 0.0001 +
                this.phase
            ) * 0.04;


        this.y +=
            Math.cos(
                time * 0.00012 +
                this.phase
            ) * 0.04;


        if (this.x < -20) {
            this.x = width + 20;
        }

        if (this.x > width + 20) {
            this.x = -20;
        }

        if (this.y < -20) {
            this.y = height + 20;
        }

        if (this.y > height + 20) {
            this.y = -20;
        }
    }


    draw(time) {

        const pulse =
            (
                Math.sin(
                    time * 0.002 +
                    this.phase
                ) + 1
            ) * 0.5;


        const size =
            this.size *
            (
                0.35 +
                pulse * 0.9
            );


        const alpha =
            0.18 +
            pulse * 0.65;


        /*
        Glow.
        */

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            size * 4,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            this.color;

        ctx.globalAlpha =
            alpha * 0.20;

        ctx.fill();


        /*
        Bright center.
        */

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            size * 0.5,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "#ffffff";

        ctx.globalAlpha =
            alpha;

        ctx.fill();


        /*
        Horizontal sparkle ray.
        */

        ctx.strokeStyle =
            this.color;

        ctx.lineWidth = 0.7;

        ctx.globalAlpha =
            alpha * 0.55;

        ctx.beginPath();

        ctx.moveTo(
            this.x - size * 3,
            this.y
        );

        ctx.lineTo(
            this.x + size * 3,
            this.y
        );

        ctx.stroke();


        /*
        Vertical sparkle ray.
        */

        ctx.beginPath();

        ctx.moveTo(
            this.x,
            this.y - size * 3
        );

        ctx.lineTo(
            this.x,
            this.y + size * 3
        );

        ctx.stroke();


        ctx.globalAlpha = 1;
    }

}


/* =========================================================
   SPARKLE ARRAY
========================================================= */

const sparkles = [];


for (
    let i = 0;
    i < 42;
    i++
) {

    sparkles.push(
        new Sparkle()
    );
}


/* =========================================================
   RESIZE
========================================================= */

function resize() {

    width =
        window.innerWidth;

    height =
        window.innerHeight;


    canvas.width =
        width;

    canvas.height =
        height;


    /*
    Rebuild glitter after resize so
    the entire viewport stays populated.
    */

    glitter.length = 0;


    const count =
        Math.min(
            320,
            Math.floor(
                (width * height) / 4500
            )
        );


    for (
        let i = 0;
        i < count;
        i++
    ) {

        glitter.push(
            new GlitterParticle()
        );
    }


    sparkles.forEach(
        sparkle => {

            if (
                sparkle.x > width
            ) {
                sparkle.x =
                    Math.random() * width;
            }

            if (
                sparkle.y > height
            ) {
                sparkle.y =
                    Math.random() * height;
            }
        }
    );
}


window.addEventListener(
    "resize",
    resize
);

resize();


/* =========================================================
   MOUSE MOVEMENT
========================================================= */

window.addEventListener(
    "mousemove",
    event => {

        mouse.x =
            event.clientX;

        mouse.y =
            event.clientY;
    }
);


window.addEventListener(
    "mouseleave",
    () => {

        mouse.x = -1000;
        mouse.y = -1000;
    }
);


/* =========================================================
   CLICK
========================================================= */

canvas.addEventListener(
    "click",
    event => {

        const rect =
            canvas.getBoundingClientRect();


        const x =
            event.clientX -
            rect.left;


        const y =
            event.clientY -
            rect.top;


        for (
            let i = nodes.length - 1;
            i >= 0;
            i--
        ) {

            const node =
                nodes[i];


            if (
                node.containsPoint(
                    x,
                    y
                )
            ) {

                if (
                    node.url &&
                    node.url !== "#"
                ) {

                    if (
                        node.url.startsWith(
                            "http"
                        )
                    ) {

                        window.open(
                            node.url,
                            "_blank",
                            "noopener,noreferrer"
                        );

                    } else {

                        window.location.href =
                            node.url;
                    }
                }

                return;
            }
        }
    }
);


/* =========================================================
   CURSOR
========================================================= */

canvas.addEventListener(
    "mousemove",
    event => {

        const rect =
            canvas.getBoundingClientRect();


        const x =
            event.clientX -
            rect.left;


        const y =
            event.clientY -
            rect.top;


        let hovering = false;


        for (
            const node of nodes
        ) {

            if (
                node.containsPoint(
                    x,
                    y
                )
            ) {

                hovering = true;
                break;
            }
        }


        canvas.style.cursor =
            hovering
                ? "pointer"
                : "default";
    }
);


/* =========================================================
   ANIMATION
========================================================= */

function animate(time) {

    /*
    CLEAR CANVAS
    */

    ctx.globalAlpha = 1;

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    /*
    =====================================================
    GLITTER — DRAW FIRST
    =====================================================
    */

    for (
        const particle of glitter
    ) {

        particle.update(time);
        particle.draw(time);
    }


    /*
    =====================================================
    LARGE SPARKLES
    =====================================================
    */

    for (
        const sparkle of sparkles
    ) {

        sparkle.update(time);
        sparkle.draw(time);
    }


    /*
    =====================================================
    UPDATE NODES
    =====================================================
    */

    for (
        const node of nodes
    ) {

        node.update(time);
    }


    /*
    =====================================================
    TENDRILS
    =====================================================
    */

    ctx.globalAlpha = 1;

    for (
        const tendril of tendrils
    ) {

        tendril.draw(time);
    }


    /*
    =====================================================
    NODES
    =====================================================
    */

    ctx.globalAlpha = 1;

    for (
        const node of nodes
    ) {

        node.draw(time);
    }


    /*
    =====================================================
    RESET CANVAS STATE
    =====================================================
    */

    ctx.globalAlpha = 1;

    ctx.shadowBlur = 0;

    ctx.shadowColor =
        "transparent";


    requestAnimationFrame(
        animate
    );
}


/* =========================================================
   START
========================================================= */

requestAnimationFrame(
    animate
);

</script>

</body>
</html>
