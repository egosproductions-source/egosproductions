/* =========================================================
   SIZE / RESIZE
========================================================= */

function resize() {

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    width =
        window.innerWidth;

    height =
        window.innerHeight;

    canvas.width =
        width * dpr;

    canvas.height =
        height * dpr;

    canvas.style.width =
        width + "px";

    canvas.style.height =
        height + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    positionNodes();
    createGlitter();
    createSparkles();
}

window.addEventListener(
    "resize",
    resize

/* =========================================================
   NODE CLASS
========================================================= */

class Node {

    constructor(config) {

        this.id =
            config.id;

        this.label =
            config.label;

        this.url =
            config.url;

        this.color =
            config.color;

        this.glow =
            config.glow;

        this.radius =
            config.size;

        this.isBold =
            !!config.bold;

        this.primary =
            !!config.primary;

        this.home =
            !!config.home;

        this.fixedX =
            config.fixedX;

        this.fixedY =
            config.fixedY;

        this.x = 0;
        this.y = 0;

        this.targetX = 0;
        this.targetY = 0;

        this.phase =
            Math.random() *
            Math.PI *
            2;

        this.hoverScale = 0;

        this.hovered = false;
    }


    update(time) {

        if (
            this.fixedX !== undefined &&
            this.fixedY !== undefined
        ) {

            this.targetX =
                width *
                this.fixedX;

            this.targetY =
                height *
                this.fixedY;

            this.x +=
                (
                    this.targetX -
                    this.x
                ) * 0.08;

            this.y +=
                (
                    this.targetY -
                    this.y
                ) * 0.08;
        }


        const targetHover =
            this.hovered
                ? 1
                : 0;

        this.hoverScale +=
            (
                targetHover -
                this.hoverScale
            ) * 0.12;
    }


    draw(time) {

        const pulse =
            Math.sin(
                time * 0.002 +
                this.phase
            ) * 0.5 + 0.5;


        /*
         * SOFT OUTER HALO
         */

        ctx.globalAlpha =
            0.10 +
            pulse * 0.08 +
            this.hoverScale * 0.12;

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            this.radius +
            6 +
            this.hoverScale * 10,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            this.glow;

        ctx.fill();

        ctx.globalAlpha = 1;


        /*
         * MAIN NODE
         */

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            this.radius +
            this.hoverScale * 3,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            this.color;

        ctx.fill();


        /*
         * SMALL INNER LIGHT
         */

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            Math.max(
                1.5,
                this.radius * 0.34
            ),
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "rgba(255,255,255,0.82)";

        ctx.globalAlpha =
            0.55 +
            pulse * 0.3;

        ctx.fill();

        ctx.globalAlpha = 1;


        /*
         * LABEL POSITION
         */

        const labelAngle =
            Math.atan2(
                this.y -
                height / 2,

                this.x -
                width / 2
            );


        const labelDistance =
            this.radius +
            19 +
            this.hoverScale * 7;


        const lx =
            this.x +
            Math.cos(labelAngle) *
            labelDistance;


        const ly =
            this.y +
            Math.sin(labelAngle) *
            labelDistance;


        /*
         * LABEL
         */

        ctx.fillStyle =
            this.color === palette.white
                ? "#f8fafc"
                : this.color;


        ctx.font =
            this.isBold
                ? "600 14px 'Trebuchet MS', 'Segoe UI', sans-serif"
                : "500 11px 'Trebuchet MS', 'Segoe UI', sans-serif";


        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";


        ctx.shadowBlur =
            8;

        ctx.shadowColor =
            this.color;


        ctx.fillText(
            this.label,
            lx,
            ly
        );


        ctx.shadowBlur = 0;
    }
}


/* =========================================================
   OUTER NODE CLASS
========================================================= */

class OuterNode extends Node {

    constructor(config) {

        super(config);

        this.distance =
            config.distance;

        this.angle =
            config.angle;
    }


    update(time) {

        const cx =
            width / 2;

        const cy =
            height / 2;


        /*
         * Keep outer nodes outside
         * the primary network while
         * allowing a very slight drift.
         */

        const drift =
            Math.sin(
                time * 0.0003 +
                this.phase
            ) * 8;


        const distance =
            this.distance +
            drift;


        this.targetX =
            cx +
            Math.cos(this.angle) *
            distance;


        this.targetY =
            cy +
            Math.sin(this.angle) *
            distance;


        this.x +=
            (
                this.targetX -
                this.x
            ) * 0.025;


        this.y +=
            (
                this.targetY -
                this.y
            ) * 0.025;


        const targetHover =
            this.hovered
                ? 1
                : 0;


        this.hoverScale +=
            (
                targetHover -
                this.hoverScale
            ) * 0.12;
    }
}


/* =========================================================
   TENDRILS
========================================================= */

class Tendril {

    constructor(
        a,
        b,
        options = {}
    ) {

        this.a = a;
        this.b = b;

        this.phase =
            Math.random() *
            Math.PI *
            2;

        this.wave =
            options.wave ||
            40;

        this.speed =
            0.0003 +
            Math.random() *
            0.0003;

        this.alpha =
            options.alpha ||
            0.10;
    }


    draw(time) {

        const ax =
            this.a.x;

        const ay =
            this.a.y;

        const bx =
            this.b.x;

        const by =
            this.b.y;


        const dx =
            bx - ax;

        const dy =
            by - ay;


        const distance =
            Math.hypot(
                dx,
                dy
            );


        if (!distance) {
            return;
        }


        const nx =
            -dy / distance;

        const ny =
            dx / distance;


        const wave =
            Math.sin(
                time *
                this.speed +
                this.phase
            ) *
            this.wave;


        const c1x =
            ax +
            dx * 0.18 +
            nx * wave;


        const c1y =
            ay +
            dy * 0.18 +
            ny * wave;


        const c2x =
            ax +
            dx * 0.72 -
            nx *
            wave *
            1.25;


        const c2y =
            ay +
            dy * 0.72 -
            ny *
            wave *
            1.25;


        /*
         * VERY SOFT OUTER GLOW
         */

        ctx.beginPath();

        ctx.moveTo(
            ax,
            ay
        );

        ctx.bezierCurveTo(
            c1x,
            c1y,
            c2x,
            c2y,
            bx,
            by
        );

        ctx.strokeStyle =
            "rgba(130,100,255,0.06)";

        ctx.lineWidth = 3;

        ctx.stroke();


        /*
         * MAIN TENDRIL
         */

        ctx.beginPath();

        ctx.moveTo(
            ax,
            ay
        );

        ctx.bezierCurveTo(
            c1x,
            c1y,
            c2x,
            c2y,
            bx,
            by
        );

        ctx.strokeStyle =
            `rgba(190,175,255,${this.alpha})`;

        ctx.lineWidth =
            0.7;

        ctx.stroke();
    }
}


/* =========================================================
   GLITTER PARTICLES
========================================================= */

class GlitterParticle {

    constructor() {

        this.x =
            Math.random() *
            width;

        this.y =
            Math.random() *
            height;


        this.vx =
            (
                Math.random() -
                0.5
            ) * 0.32;


        this.vy =
            (
                Math.random() -
                0.5
            ) * 0.32;


        this.size =
            Math.random() *
            1.8 +
            0.7;


        this.phase =
            Math.random() *
            Math.PI *
            2;


        this.speed =
            0.001 +
            Math.random() *
            0.002;


        this.color =
            [
                palette.white,
                palette.blue,
                palette.purple,
                palette.orange
            ][
                Math.floor(
                    Math.random() * 4
                )
            ];


        /*
         * Only 18% of particles glow.
         * The rest remain simple glitter.
         */

        this.hasGlow =
            Math.random() < 0.18;
    }


    update(time) {

        this.x +=
            this.vx;

        this.y +=
            this.vy;


        /*
         * Gentle organic movement
         */

        this.x +=
            Math.sin(
                time * 0.00015 +
                this.phase
            ) * 0.025;


        this.y +=
            Math.cos(
                time * 0.00012 +
                this.phase
            ) * 0.025;


        /*
         * Wrap around edges
         */

        if (
            this.x <
            -10
        ) {
            this.x =
                width + 10;
        }

        if (
            this.x >
            width + 10
        ) {
            this.x = -10;
        }


        if (
            this.y <
            -10
        ) {
            this.y =
                height + 10;
        }

        if (
            this.y >
            height + 10
        ) {
            this.y = -10;
        }
    }


    draw(time) {

        const twinkle =
            (
                Math.sin(
                    time *
                    this.speed +
                    this.phase
                ) + 1
            ) * 0.5;


        /*
         * MUCH SUBTLER PARTICLE OPACITY
         */

        const alpha =
            0.18 +
            twinkle * 0.30;


        const size =
            this.size *
            (
                0.75 +
                twinkle * 0.9
            );


        /*
         * MAIN GLITTER DOT
         *
         * Every particle gets this.
         * Most particles stop here.
         */

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            this.color;

        ctx.globalAlpha =
            alpha;

        ctx.fill();


        /*
         * ONLY A SMALL PERCENTAGE
         * GET THE GLOW EFFECT
         */

        if (
            this.hasGlow
        ) {

            ctx.beginPath();

            ctx.arc(
                this.x,
                this.y,
                size * 2.5,
                0,
                Math.PI * 2
            );

            ctx.fillStyle =
                this.color;

            ctx.globalAlpha =
                alpha * 0.05;

            ctx.fill();


            /*
             * Tiny white center
             */

            ctx.beginPath();

            ctx.arc(
                this.x,
                this.y,
                size * 0.35,
                0,
                Math.PI * 2
            );

            ctx.fillStyle =
                "#ffffff";

            ctx.globalAlpha =
                0.35 +
                twinkle * 0.25;

            ctx.fill();
        }


        ctx.globalAlpha = 1;
    }
}


/* =========================================================
   LARGER SPARKLES
========================================================= */

class Sparkle {

    constructor() {

        this.x =
            Math.random() *
            width;

        this.y =
            Math.random() *
            height;


        this.phase =
            Math.random() *
            Math.PI *
            2;


        this.size =
            Math.random() *
            2.2 +
            1;


        this.speed =
            0.001 +
            Math.random() *
            0.0015;


        this.color =
            [
                palette.white,
                palette.blue,
                palette.purple,
                palette.orange
            ][
                Math.floor(
                    Math.random() * 4
                )
            ];
    }


    update(time) {

        this.x +=
            Math.sin(
                time * 0.00015 +
                this.phase
            ) * 0.035;

        this.y +=
            Math.cos(
                time * 0.00013 +
                this.phase
            ) * 0.035;


        if (
            this.x < -20
        ) {
            this.x =
                width + 20;
        }

        if (
            this.x >
            width + 20
        ) {
            this.x = -20;
        }


        if (
            this.y < -20
        ) {
            this.y =
                height + 20;
        }

        if (
            this.y >
            height + 20
        ) {
            this.y = -20;
        }
    }


    draw(time) {

        const pulse =
            (
                Math.sin(
                    time *
                    this.speed +
                    this.phase
                ) + 1
            ) * 0.5;


        const alpha =
            0.10 +
            pulse * 0.28;


        const size =
            this.size *
            (
                0.75 +
                pulse * 0.6
            );


        /*
         * Subtle glow
         */

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            size * 3,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            this.color;

        ctx.globalAlpha =
            alpha * 0.12;

        ctx.fill();


        /*
         * Four-point sparkle
         */

        ctx.strokeStyle =
            this.color;

        ctx.globalAlpha =
            alpha;


        ctx.lineWidth =
            0.7;


        ctx.beginPath();

        ctx.moveTo(
            this.x - size * 3,
            this.y
        );

        ctx.lineTo(
            this.x + size * 3,
            this.y
        );

        ctx.moveTo(
            this.x,
            this.y - size * 3
        );

        ctx.lineTo(
            this.x,
            this.y + size * 3
        );

        ctx.stroke();


        ctx.globalAlpha = 1;
    }
}


/* =========================================================
   CREATE NODES
========================================================= */

let nodes = [];
let planets = [];

function createNodes() {

    nodes = [];

    navigationNodes.forEach(
        config => {

            nodes.push(
                new Node(config)
            );
        }
    );


    planets = [];

    outerNodes.forEach(
        config => {

            planets.push(
                new OuterNode(config)
            );
        }
    );


    positionNodes();
}


/* =========================================================
   INITIAL NODE POSITIONS
========================================================= */

function positionNodes() {

    nodes.forEach(
        node => {

            if (
                node.fixedX !== undefined &&
                node.fixedY !== undefined
            ) {

                node.x =
                    width *
                    node.fixedX;

                node.y =
                    height *
                    node.fixedY;
            }

            else {

                node.x =
                    width *
                    (
                        0.15 +
                        Math.random() *
                        0.7
                    );

                node.y =
                    height *
                    (
                        0.15 +
                        Math.random() *
                        0.7
                    );
            }
        }
    );


    planets.forEach(
        planet => {

            const cx =
                width / 2;

            const cy =
                height / 2;


            planet.x =
                cx +
                Math.cos(
                    planet.angle
                ) *
                planet.distance;


            planet.y =
                cy +
                Math.sin(
                    planet.angle
                ) *
                planet.distance;
        }
    );
}


/* =========================================================
   TENDRIL CREATION
========================================================= */

let tendrils = [];


function createTendrils() {

    tendrils = [];


    /*
     * HOME is deliberately excluded.
     */

    const primaryNodes =
        nodes.filter(
            node =>
                node.primary &&
                !node.home
        );


    /*
     * Connect every primary
     * node to every other
     * primary node.
     */

    for (
        let i = 0;
        i < primaryNodes.length;
        i++
    ) {

        for (
            let j = i + 1;
            j < primaryNodes.length;
            j++
        ) {

            tendrils.push(
                new Tendril(
                    primaryNodes[i],
                    primaryNodes[j],
                    {
                        wave:
                            30 +
                            Math.random() * 30,

                        alpha:
                            0.075 +
                            Math.random() * 0.035
                    }
                )
            );
        }
    }


    /*
     * Additional tendrils between
     * the smaller network nodes.
     */

    const networkNodes =
        nodes.filter(
            node =>
                !node.home
        );


    for (
        let i = 0;
        i < networkNodes.length;
        i++
    ) {

        for (
            let j = i + 1;
            j < networkNodes.length;
            j++
        ) {

            if (
                Math.random() <
                0.34
            ) {

                tendrils.push(
                    new Tendril(
                        networkNodes[i],
                        networkNodes[j],
                        {
                            wave:
                                22 +
                                Math.random() * 32,

                            alpha:
                                0.045 +
                                Math.random() * 0.035
                        }
                    )
                );
            }
        }
    }


    /*
     * Connect each outer node
     * to two primary nodes.
     */

    planets.forEach(
        planet => {

            const shuffled =
                [...primaryNodes]
                    .sort(
                        () =>
                            Math.random() -
                            0.5
                    );


            for (
                let i = 0;
                i < 2;
                i++
            ) {

                tendrils.push(
                    new Tendril(
                        planet,
                        shuffled[i],
                        {
                            wave:
                                45 +
                                Math.random() * 25,

                            alpha:
                                0.07
                        }
                    )
                );
            }
        }
    );
}


/* =========================================================
   GLITTER
========================================================= */

let particles = [];


function createGlitter() {

    particles = [];


    /*
     * More glitter, but most of it
     * is now simple/non-glowing.
     */

    const glitterCount =
        Math.min(
            500,
            Math.floor(
                (
                    width *
                    height
                ) / 3000
            )
        );


    for (
        let i = 0;
        i < glitterCount;
        i++
    ) {

        particles.push(
            new GlitterParticle()
        );
    }
}


/* =========================================================
   SPARKLES
========================================================= */

let sparkles = [];


function createSparkles() {

    sparkles = [];


    /*
     * Separate from the small
     * glitter particles.
     */

    const sparkleCount =
        Math.min(
            28,
            Math.floor(
                (
                    width *
                    height
                ) / 28000
            ) + 8
        );


    for (
        let i = 0;
        i < sparkleCount;
        i++
    ) {

        sparkles.push(
            new Sparkle()
        );
    }
}


/* =========================================================
   MOUSE / TOUCH
========================================================= */

let pointerX = -9999;
let pointerY = -9999;


function updatePointer(
    x,
    y
) {

    pointerX = x;
    pointerY = y;


    const allNodes =
        [
            ...nodes,
            ...planets
        ];


    allNodes.forEach(
        node => {

            const distance =
                Math.hypot(
                    node.x -
                    pointerX,

                    node.y -
                    pointerY
                );


            node.hovered =
                distance <
                node.radius + 20;
        }
    );
}


canvas.addEventListener(
    "mousemove",
    event => {

        const rect =
            canvas.getBoundingClientRect();


        updatePointer(
            event.clientX -
            rect.left,

            event.clientY -
            rect.top
        );
    }
);


canvas.addEventListener(
    "mouseleave",
    () => {

        pointerX = -9999;
        pointerY = -9999;

        nodes.forEach(
            node =>
                node.hovered = false
        );

        planets.forEach(
            node =>
                node.hovered = false
        );
    }
);


canvas.addEventListener(
    "touchmove",
    event => {

        if (
            !event.touches.length
        ) {
            return;
        }


        const rect =
            canvas.getBoundingClientRect();


        const touch =
            event.touches[0];


        updatePointer(
            touch.clientX -
            rect.left,

            touch.clientY -
            rect.top
        );
    },
    {
        passive: true
    }
);


/* =========================================================
   CLICK NAVIGATION
========================================================= */

canvas.addEventListener(
    "click",
    event => {

        const rect =
            canvas.getBoundingClientRect();


        const x =
            event.clientX -
            rect.left;

        const y =
            event.clientY -
            rect.top;


        const allNodes =
            [
                ...nodes,
                ...planets
            ];


        for (
            const node of allNodes
        ) {

            const distance =
                Math.hypot(
                    node.x - x,
                    node.y - y
                );


            if (
                distance <=
                node.radius + 18
            ) {

                if (
                    node.url &&
                    node.url !== "#"
                ) {

                    if (
                        node.url.startsWith(
                            "http"
                        ) ||
                        node.url.startsWith(
                            "mailto:"
                        )
                    ) {

                        window.open(
                            node.url,
                            "_blank"
                        );

                    }

                    else {

                        window.location.href =
                            node.url;
                    }
                }

                return;
            }
        }
    }
);


/* =========================================================
   ANIMATION
========================================================= */

function animate(time) {

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    /*
     * BACKGROUND ATMOSPHERE
     *
     * Glitter is intentionally
     * drawn first so it sits behind
     * the network.
     */

    particles.forEach(
        particle => {

            particle.update(time);

            particle.draw(time);
        }
    );


    sparkles.forEach(
        sparkle => {

            sparkle.update(time);

            sparkle.draw(time);
        }
    );


    /*
     * UPDATE NODES
     */

    nodes.forEach(
        node =>
            node.update(time)
    );


    planets.forEach(
        planet =>
            planet.update(time)
    );


    /*
     * TENDRILS
     *
     * Drawn behind the nodes.
     */

    tendrils.forEach(
        tendril =>
            tendril.draw(time)
    );


    /*
     * NODES
     *
     * Drawn last so they remain
     * crisp and visible.
     */

    nodes.forEach(
        node =>
            node.draw(time)
    );


    planets.forEach(
        planet =>
            planet.draw(time)
    );


    requestAnimationFrame(
        animate
    );
}


/* =========================================================
   START
========================================================= */

resize();

createNodes();

createTendrils();

requestAnimationFrame(
    animate
);

</script>

</body>
</html>
