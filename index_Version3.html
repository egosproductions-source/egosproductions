<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Egos Productions</title>
  <style>
    :root {
      --bg-1: #050b17;
      --bg-2: #0d1630;
      --bg-3: #120d25;
      --blue: #1d4ed8;
      --purple: #4c1d95;
      --orange: #f97316;
      --white: #f8fafc;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(180deg, var(--bg-2), var(--bg-1));
      font-family: "Segoe UI", Helvetica, Arial, sans-serif;
      color: var(--white);
    }

    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 70px;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(5, 11, 23, 0.68);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      z-index: 50;
    }

    .brand {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--white);
    }

    .nav-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .web-button {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--white);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 10px 18px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .web-button:hover {
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.2);
    }

    .main-content {
      padding-top: 90px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .hero {
      max-width: 800px;
      padding: 40px;
    }

    .hero h1 {
      font-size: clamp(2.5rem, 6vw, 5rem);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .hero p {
      font-size: 1rem;
      color: rgba(248, 250, 252, 0.7);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* modal overlay */
    .modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(10px);
      z-index: 1000;
    }

    .modal.open {
      display: flex;
    }

    .modal-panel {
      position: relative;
      width: min(92vw, 1200px);
      height: min(88vh, 900px);
      border-radius: 14px;
      overflow: hidden;
      background: #0b1220;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
    }

    .modal-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05);
      color: white;
      font-size: 18px;
      cursor: pointer;
      z-index: 10;
    }

    .modal-close:hover {
      background: rgba(255,255,255,0.1);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #050b17;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">Egos</div>
    <nav class="nav-actions">
      <button class="web-button" id="open-web">Web</button>
    </nav>
  </header>

  <main class="main-content">
    <section class="hero">
      <h1>Welcome</h1>
      <p>Creative digital works in motion</p>
    </section>
  </main>

  <div class="modal" id="web-modal">
    <div class="modal-panel">
      <button class="modal-close" id="close-web" aria-label="Close">✕</button>
      <iframe src="network-viewer.html" title="Interactive Network"></iframe>
    </div>
  </div>

  <script>
    const modal = document.getElementById("web-modal");
    const openBtn = document.getElementById("open-web");
    const closeBtn = document.getElementById("close-web");

    openBtn.addEventListener("click", () => {
      modal.classList.add("open");
    });

    closeBtn.addEventListener("click", () => {
      modal.classList.remove("open");
    });

    modal.addEventListener("click", (e) => {
      if (e.target === modal) {
        modal.classList.remove("open");
      }
    });
  </script>
</body>
</html>
