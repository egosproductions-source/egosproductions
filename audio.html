<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>e-Gos Productions | Audio</title>
    <link rel="icon" href="img/core-img/favicon.ico">
    <link rel="stylesheet" href="style.css">
    <style>
        .site-nav {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            padding: 1rem 2rem;
            background: rgba(10, 10, 18, 0.82);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .site-nav a, .site-nav button {
            color: #fff;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 600;
            font-size: 0.75rem;
            background: transparent;
            border: none;
            cursor: pointer;
        }
        .site-nav .brand { margin-right: 0.5rem; font-size: 0.9rem; }
        .site-nav .dropdown { position: relative; }
        .site-nav .dropdown-menu {
            position: absolute;
            left: 0;
            top: calc(100% + 0.7rem);
            display: none;
            flex-direction: column;
            min-width: 180px;
            padding: 0.5rem;
            background: rgba(17, 17, 24, 0.96);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            box-shadow: 0 20px 30px rgba(0,0,0,0.25);
        }
        .site-nav .dropdown:hover .dropdown-menu,
        .site-nav .dropdown:focus-within .dropdown-menu { display: flex; }
        .site-nav .dropdown-menu a {
            padding: 0.6rem 0.8rem;
            border-radius: 8px;
            text-transform: none;
            letter-spacing: 0.01em;
            font-weight: 500;
        }
        .site-nav .dropdown-menu a:hover { background: rgba(255,255,255,0.05); }
        .page-shell { max-width: 960px; margin: 3rem auto; padding: 0 1.5rem 4rem; }
        .page-shell h1 { text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 1rem; }
        .page-shell p { color: #b4bed5; line-height: 1.8; }
        .audio-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            padding: 1.5rem;
            margin-top: 2rem;
        }
        .audio-card h2 { text-transform: uppercase; font-size: 1rem; letter-spacing: 0.08em; }
        audio { width: 100%; margin-top: 0.75rem; }
        @media (max-width: 700px) { .site-nav { flex-wrap: wrap; gap: 0.75rem 1rem; } }
    </style>
</head>

                <a href="performance.html">Performance</a>

        </div>

        <a href="contact.html">Contact</a>

                    <nav class="classy-navbar justify-content-between" id="oneMusicNav">
                        <a href="index.html" class="nav-brand"><img src="img/core-img/logo.png" alt=""></a>
                        <div class="classy-navbar-toggler"><span class="navbarToggler"><span></span><span></span><span></span></span></div>
                        <div class="classy-menu">
                            <div class="classycloseIcon"><div class="cross-wrap"><span class="top"></span><span class="bottom"></span></div></div>
                            <div class="classynav">
                                <ul>
                                    <li><a href="index.html">Home</a></li>
                                    <li>

                                        <ul class="dropdown">
                                            <li><a href="audio.html">Audio</a></li>
                                            <li><a href="video.html">Video</a></li>
                                            <li><a href="visual.html">Visual Art</a></li>
                                            <li><a href="performance.html">Performance</a></li>
                                        </ul>
                                    </li>
                                    <li><a href="event.html">Events</a></li>
                                    <li><a href="contact.html">Contact</a></li>
                                </ul>
                            </div>
                        </div>
                    </nav>
                </div>
            </div>
        </div>
    </header>

    <main class="page-shell">
        <h1>Audio</h1>
        <p>Experimental sound work, live recordings, and sonic material shaped by motion, atmosphere, and improvisation.</p>

        <div class="audio-card">
            <h2>Featured audio</h2>
            <audio controls preload="metadata">
                <source src="audio/dummy-audio.mp3" type="audio/mpeg">
            </audio>
        </div>
    </main>

    <script src="js/jquery/jquery-2.2.4.min.js"></script>

    <script src="js/active.js"></script>
</body>
</html>
