<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>e-Gos Network</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 45%, rgba(29, 78, 216, 0.18), transparent 25%),
        radial-gradient(circle at 35% 30%, rgba(76, 29, 149, 0.18), transparent 30%),
        linear-gradient(180deg, #0d1630, #050b17);
      font-family: "Segoe UI", Helvetica, Arial, sans-serif;
    }

    #network-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: transparent;
    }
  </style>
</head>
<body>
  <canvas id="network-canvas"></canvas>

  <script>
    const canvas = document.getElementById("network-canvas");
    const ctx = canvas.getContext("2d");

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    const palette = {
      blue: "#1d4ed8",
      purple: "#4c1d95",
      orange: "#f97316",
      white: "#f8fafc",
      blueSoft: "rgba(29, 78, 216, 0.35)",
      purpleSoft: "rgba(76, 29, 149, 0.35)",
      orangeSoft: "rgba(249, 115, 22, 0.35)",
      whiteSoft: "rgba(248, 250, 252, 0.2)"
    };

    const navigationNodes = [
      { id: "home", label: "HOME", url: "/index.html", color: palette.white, glow: palette.whiteoft, baseAngle: 0.2, distance: 260, size: 16, isBold: true },
      { id: "about", label: "ABOUT", url: "/about.html", color: palette.bluee, glow: palette.blueSoft, baseAngle: 1.7, distance: 290, size: 12, isBold: true },
      { id: "audio", label: "AUDIO", url: "/audio.html", color: palette.blue, glow: palette.blueSoft, baseAngle: 3.4, distance: 265, size: 12, isBold: true },
      { id: "video", label: "VIDEO", url: "/video.html", color: palette.blue, glow: palette.blueSoft, baseAngle: 5.2, distance: 300, size: 12, isBold: true },
      { id: "visual", label: "VISUAL", url: "/visual.html", color: palette.blue, glow: palette.blueSoft, baseAngle: 6.8, distance: 270, size: 12, isBold: true },
      { id: "performance", label: "PERFORMANCE", url: "/performance.html", color: palette.blue, glow: palette.blueSoft, baseAngle: 0.9, distance: 155, size: 10 },
      
      { id: "events", label: "EVENTS", url: "/events.html", color: palette.orange, glow: palette.orangeSoft, baseAngle: 2.9, distance: 170, size: 10 },
      { id: "contact", label: "CONTACT", url: "/contact.html", color: palette.orange, glow: palette.orangeSoft, baseAngle: 5.1, distance: 165, size: 10 },

      { id: "instagram", label: "INSTAGRAM", url: "https://www.instagram.com/egos.producer/", color: palette.purple, glow: palette.purpleSoft, baseAngle: 1.1, distance: 72, size: 8 },
      { id: "spotify", label: "SPOTIFY", url: "https://open.spotify.com/artist/7BO0dsRrLZgyIqVinsUjnA?si=rrb20EO4SI-xgIIj46CuUQ", color: palette.purple, glow: palette.purpleSoft, baseAngle: 2.5, distance: 78, size: 8 },
      { id: "soundcloud", label: "SOUNDCLOUD", url: "https://soundcloud.com/e-gosss", color: palette.purple, glow: palette.purpleSoft, baseAngle: 4.2, distance: 82, size: 8 },
      { id: "booking", label: "BOOKING", url: "mailto:booking@egosproductions.com", color: palette.purple, glow: palette.purpleSoft, baseAngle: 5.8, distance: 74, size: 8 }
    ];

    let nodes = [];
    let particles = [];
    let tendrils = [];

    class InteractiveNode {
      constructor(config) {
        this.id = config.id;
        this.label = config.label;
        this.url = config.url || null;
        this.baseAngle = config.baseAngle;
        this.distance = config.distance;
        this.color = config.color;
        this.glow = config.glow;
        this.radius = config.size;
        this.size = config.size;
        this.isBold = config.isBold || false;

        this.x = 0;
        this.y = 0;
        this.hoverScale = 0;
        this.pulse = 0;
        this.phase = Math.random() * Math.PI * 2;
        this.isHovered = false;
      }

      update(time) {
        const cx = width / 2;
        const cy = height / 2;

        const drift = Math.sin(time * 0.00018 + this.phase) * 8;
        const orbit = this.baseAngle + Math.sin(time * 0.00012 + this.phase) * 0.14;
        const distance = this.distance + drift;

        this.x = cx + Math.cos(orbit) * distance;
        this.y = cy + Math.sin(orbit) * distance;

        this.pulse = 1 + Math.sin(time * 0.0016 + this.phase) * 0.8;

        const target = this.isHovered ? 1 : 0;
        this.hoverScale += (target - this.hoverScale) * 0.08;
      }

      draw() {
        const glowRadius = this.radius + this.pulse * 7 + this.hoverScale * 12;

        ctx.beginPath();
        ctx.arc(this.x, this.y, glowRadius, 0, Math.PI * 2);
        ctx.fillStyle = this.glow;
        ctx.fill();

        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius + this.pulse * 4 + this.hoverScale * 8, 0, Math.PI * 2);
        ctx.fillStyle = this.glow.replace("0.35", "0.22").replace("0.2", "0.22");
        ctx.fill();

        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius + this.hoverScale * 4, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();

        ctx.beginPath();
        ctx.arc(this.x, this.y, Math.max(1.6, this.radius * 0.35), 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255,255,255,0.8)";
        ctx.fill();

        ctx.fillStyle = this.color === palette.white ? "#f8fafc" : this.color;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.letterSpacing = "0.08em";
        ctx.globalAlpha = 0.7 + this.hoverScale * 0.25;

        if (this.isBold) {
          ctx.font = "700 13px Segoe UI, sans-serif";
        } else {
          ctx.font = "600 10px Segoe UI, sans-serif";
        }

        const labelAngle = Math.atan2(this.y - height / 2, this.x - width / 2);
        const labelDistance = this.radius + 20 + this.hoverScale * 8;
        const lx = this.x + Math.cos(labelAngle) * labelDistance;
        const ly = this.y + Math.sin(labelAngle) * labelDistance;

        ctx.fillText(this.label, lx, ly);
        ctx.globalAlpha = 1;
      }

      hitTest(mx, my) {
        const dist = Math.hypot(this.x - mx, this.y - my);
        const hitRadius = this.radius + 14 + this.hoverScale * 10;
        this.isHovered = dist < hitRadius;
        return this.isHovered;
      }
    }

    class GlitterParticle {
      constructor() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.vx = (Math.random() - 0.5) * 0.18;
        this.vy = (Math.random() - 0.5) * 0.18;
        this.size = Math.random() * 1.8 + 0.5;
        this.alpha = Math.random() * 0.7 + 0.2;
        this.phase = Math.random() * Math.PI * 2;
        this.color = ["#f8fafc", "#1d4ed8", "#4c1d95"][Math.floor(Math.random() * 3)];
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;

        if (this.x < 0 || this.x > width) this.vx *= -1;
        if (this.y < 0 || this.y > height) this.vy *= -1;

        this.x = Math.min(width, Math.max(0, this.x));
        this.y = Math.min(height, Math.max(0, this.y));

        this.alpha = 0.2 + (Math.sin(performance.now() * 0.0018 + this.phase) + 1) * 0.25;
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.globalAlpha = this.alpha;
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    class Tendril {
      constructor(a, b) {
        this.a = a;
        this.b = b;
        this.offset = Math.random() * Math.PI * 2;
        this.baseColor = a.color === palette.white ? palette.white : a.color;
      }

      update(time) {
        this.offset = time * 0.00008 + this.offset * 0.02;
      }

      draw() {
        const midX = (this.a.x + this.b.x) / 2;
        const midY = (this.a.y + this.b.y) / 2;
        const curve = 18;

        const waveX = midX + Math.sin(this.offset) * curve;
        const waveY = midY + Math.cos(this.offset * 1.4) * curve;

        ctx.beginPath();
        ctx.moveTo(this.a.x, this.a.y);
        ctx.quadraticCurveTo(waveX, waveY, this.b.x, this.b.y);

        ctx.strokeStyle = this.baseColor;
        ctx.lineWidth = 0.7;
        ctx.globalAlpha = 0.18;
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(this.a.x, this.a.y);
        ctx.quadraticCurveTo(waveX, waveY, this.b.x, this.b.y);

        ctx.strokeStyle = this.baseColor;
        ctx.lineWidth = 2.2;
        ctx.globalAlpha = 0.04;
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }

    function createTendrils() {
      tendrils = [];
      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          const distance = Math.hypot(nodes[i].x - nodes[j].x, nodes[i].y - nodes[j].y);
          if (distance < 420) {
            tendrils.push(new Tendril(nodes[i], nodes[j]));
          }
        }
      }
    }

    function initScene() {
      nodes = navigationNodes.map(config => new InteractiveNode(config));
      particles = [];

      for (let i = 0; i < 120; i++) {
        particles.push(new GlitterParticle());
      }

      createTendrils();
    }

    function animate(time) {
      ctx.clearRect(0, 0, width, height);

      particles.forEach(p => p.update());
      nodes.forEach(node => node.update(time));

      tendrils.forEach(t => t.update(time));
      tendrils.forEach(t => t.draw());

      particles.forEach(p => p.draw());

      nodes.forEach(node => node.draw());

      requestAnimationFrame(animate);
    }

    canvas.addEventListener("mousemove", (event) => {
      const rect = canvas.getBoundingClientRect();
      const mx = event.clientX - rect.left;
      const my = event.clientY - rect.top;

      let hoverFound = false;
      nodes.forEach(node => {
        if (node.hitTest(mx, my)) {
          hoverFound = true;
        }
      });

      canvas.style.cursor = hoverFound ? "pointer" : "default";
    });

    canvas.addEventListener("mouseleave", () => {
      nodes.forEach(node => {
        node.isHovered = false;
      });
      canvas.style.cursor = "default";
    });

    canvas.addEventListener("click", (event) => {
      const rect = canvas.getBoundingClientRect();
      const mx = event.clientX - rect.left;
      const my = event.clientY - rect.top;

      for (const node of nodes) {
        if (node.hitTest(mx, my)) {
          window.location.href = node.url;
          return;
        }
      }
    });

    window.addEventListener("resize", () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      initScene();
    });

    initScene();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
